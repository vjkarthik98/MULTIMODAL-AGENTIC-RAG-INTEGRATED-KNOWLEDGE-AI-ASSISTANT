# Phase 31 — OpenTelemetry Collector config.
#
# Receives spans from the app via OTLP gRPC (app/main.py's OTLPSpanExporter,
# settings.OTEL_EXPORTER_OTLP_ENDPOINT — must be set to
# http://otel-collector:4317 in /opt/magik/.env, NOT the code default of
# localhost:4317, since the app and this collector are separate containers
# on the magik-net docker network). Exports the SAME spans to two places —
# no re-instrumentation, just two exporters on one pipeline:
#   - Tempo: storage/waterfall view in Grafana Explore (see monitoring/
#     grafana/provisioning/datasources.yml).
#   - Phoenix (Phase 31 monitoring, Phase 4): LLM/RAG-native trace UI —
#     embedding-space clustering, per-span retrieved-document inspection —
#     on the query_pipeline.py/rag_pipeline.py/hybrid_retriever.py/
#     reranker.py spans already OpenInference-attribute-enriched for it.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  # A single small host with intermittent scale-to-zero traffic doesn't need
  # unbounded span retention in memory between flushes.
  memory_limiter:
    check_interval: 5s
    limit_mib: 200
    spike_limit_mib: 50

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp/phoenix:
    endpoint: phoenix:4317
    tls:
      insecure: true
  # Prometheus-format re-export of whatever the app sends this collector via
  # OTLP metrics (currently nothing — app/main.py only exports traces here;
  # its own /metrics is scraped directly by Prometheus, port 9464). Kept for
  # future use. Deliberately NOT :8888 — that's the collector's own
  # self-telemetry port below, and both listeners live in the same process,
  # so a shared port is a bind conflict, not a merge. This collided until
  # 2026-07-31 and crash-looped the container.
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  # Collector's own health/throughput self-metrics — scraped by Prometheus
  # (see monitoring/prometheus/prometheus.yml's otel-collector job). Must
  # bind 0.0.0.0, not the otelcol-contrib default of localhost:8888 —
  # Prometheus scrapes this cross-container as `otel-collector:8888`, which
  # resolves to this container's eth0, not its loopback; a bare default
  # silently made the job unreachable even once the port collision on this
  # same 8888 (the prometheus *exporter*, above) is fixed.
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, otlp/phoenix]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
