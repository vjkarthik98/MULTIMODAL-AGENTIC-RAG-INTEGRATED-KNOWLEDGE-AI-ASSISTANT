# Phase 31 — Loki config: single-binary, local filesystem storage (no S3/GCS)
# — same convention as monitoring/tempo/tempo.yaml, appropriate for a
# single-host, scale-to-zero deployment. Bounded retention keeps this off the
# 100GB EBS root volume's critical path (models + data already dominate it).

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h # 7 days — matches Tempo's trace retention on this box
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # A single misbehaving container looping the same error can otherwise
  # generate an unbounded stream; cap per-stream rate rather than let one
  # noisy source starve ingestion for everything else on the box.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
