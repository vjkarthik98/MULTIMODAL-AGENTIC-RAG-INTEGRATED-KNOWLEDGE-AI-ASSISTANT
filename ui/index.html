<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- viewport-fit=cover lets the page paint into the notch/home-indicator
         area; the `*-safe` utilities in index.css then inset the content that
         must not be covered. Zoom is deliberately NOT disabled (no
         user-scalable=no / maximum-scale=1) — blocking pinch-zoom is an
         accessibility failure and browsers increasingly ignore it anyway.
         interactive-widget=resizes-content opts back into the classic
         behavior where the on-screen keyboard shrinks the LAYOUT viewport
         (what `dvh` is defined against), not just the visual one. Modern
         Chromium's (and so Brave's) *default* is now resizes-visual —
         layout viewport stays full height, keyboard just overlays on top —
         which is exactly why `.h-dvh-screen` (100dvh) stopped tracking the
         keyboard and left a gap between the composer and the keyboard on
         Android. This is the platform-level fix Chrome's own docs recommend
         for chat-style composers; no JS measurement needed once it's set. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>MAGIK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: media="print" makes the browser fetch it at
         low priority without making it a render-blocking resource, then
         onload flips it to media="all" once it's actually ready. First paint
         (and Lighthouse's FCP measurement) must never wait on a third-party
         network round trip succeeding — a slow/unreachable fonts.googleapis.com
         should degrade to the system font, not delay the whole page. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
  <script>
    (function(){var t=localStorage.getItem('magik_theme');if(t==='light')document.documentElement.classList.add('light')})()
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
