# Local CPU-only dev stack — API + local Qdrant/Redis/Mongo, no GPU, no
# 17GB+ multimodal model download required to bring the API up and exercise
# non-model-dependent endpoints (health, auth, routing logic). Uses the
# `dev-runtime` Dockerfile target (python:3.12-slim, no CUDA base image) for
# fast local builds — see Dockerfile's top-of-file comment for the target list.
#
# NOTE: the long-term conversation-memory feature uses Upstash's REST Redis
# client (app/memory/) against real Upstash Cloud credentials in production;
# this compose file's `redis` service only backs the LOCAL hot-path cache
# (settings.LOCAL_CACHE_HOST/PORT — job status, embedding cache, rate limits),
# not the Upstash-backed long-term store. Set REDIS_URL in .env to point at a
# real Upstash instance if you need to exercise that path locally.
#
# `python -m app.eval.run --suite retrieval` will NOT work against this local
# Qdrant out of the box — it needs the eval corpus already ingested under
# EVAL_USER_ID, which this compose file does not seed. See eval-gate.yml and
# docs/runbooks/ci-cd.md for how that's provisioned.

services:
  api:
    build:
      context: .
      target: dev-runtime
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENV: development
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MONGO_URI: mongodb://mongo:27017
      LOCAL_CACHE_HOST: redis
      LOCAL_CACHE_PORT: "6379"
      # Without this, TORCH_HOME falls back to start_server.py's own default
      # (.torch_cache, project-root-relative) — not one of the volumes below,
      # so anything cached there (detoxify's torch.hub weights) is wiped on
      # every `docker compose down` + `up`. Same fix as cd.yml's production
      # `docker run` already applies; mirrored here for dev-runtime parity.
      TORCH_HOME: /app/.hf_cache/torch
      # API-only mode for CI smoke/DAST jobs — both default OFF, so a plain
      # `docker compose up` behaves exactly as before (full model bootstrap).
      # .github/workflows/quality.yml sets SKIP_MODEL_BOOTSTRAP=true because
      # its runners bind-mount an EMPTY .hf_cache: without it start_server.py
      # downloads ~25GB before uvicorn ever binds and /health never answers.
      # See skip_model_bootstrap() in start_server.py for the full rationale.
      SKIP_MODEL_BOOTSTRAP: ${SKIP_MODEL_BOOTSTRAP:-false}
      WARMUP_AT_STARTUP: ${WARMUP_AT_STARTUP:-true}
      # Settings.validate() (app/core/config.py) requires JWT_SECRET_KEY >= 32
      # chars whenever AUTH_ENABLED is true (the default) — independent of ENV.
      # Locally this is a non-issue: env_file above loads the real value from
      # .env. In CI there IS no .env (gitignored, not checked out), so
      # JWT_SECRET_KEY fell back to config.py's own "CHANGE_ME_IN_PRODUCTION"
      # default (23 chars) and the app crashed at import time on every single
      # `docker compose up` — confirmed live via `docker compose logs api`
      # (2026-08-20, run 32359742368): "ValueError: Config validation failed
      # ... JWT_SECRET_KEY must be at least 32 characters long", raised before
      # uvicorn ever bound the port, which is what "Wait for API health"
      # actually saw as connection-refused for its whole timeout window.
      # ci.yml's lint-type-test job hit the identical validate() gap and
      # already documents + placeholders it the same way; mirrored here.
      # `${JWT_SECRET_KEY:-...}` is compose's own interpolation (reads the
      # project-root .env or shell env, same file env_file loads at runtime),
      # so a real local .env value passes through unchanged — this only ever
      # supplies the placeholder when nothing else set it.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ci-test-only-placeholder-jwt-secret-not-a-real-credential}
    volumes:
      - ./.hf_cache:/app/.hf_cache
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.9.7
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
  mongo_data:
