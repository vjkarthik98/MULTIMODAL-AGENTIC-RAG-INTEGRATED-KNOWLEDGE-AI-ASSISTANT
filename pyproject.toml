[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name            = "MULTIMODAL-AGENTIC-RAG-INTEGRATED-KNOWLEDGE-AI-ASSISTANT"
version         = "1.0.0-rc2"
description     = "Production Multimodal RAG + Agentic AI System — Phase 31"
readme          = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Your Name" }
]

keywords = [
    "rag", "multimodal", "llm", "agents",
    "retrieval", "embeddings", "qdrant", "mistral"
]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web Framework
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",

    # Data Validation & Configuration
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",

    # LLM Inference — llama.cpp runs as a separate process (llama-server);
    # see install_cuda.sh for the CUDA build required on GPU deployments.
    "llama-cpp-python>=0.2.60",
    "sse-starlette>=2.0",
    "starlette-context>=0.3",
    "huggingface_hub>=0.22",

    # Machine Learning & Embeddings — transformers pinned <5.0: v5's
    # tokenizer backend refactor breaks TrOCR's slow-tokenizer path.
    "torch>=2.6",
    "torchvision>=0.21",
    "torchaudio>=2.6",
    "sentence-transformers>=2.7",
    "transformers>=4.45,<5.0",
    "sentencepiece>=0.2.0",
    "accelerate>=1.1.0",
    "bitsandbytes>=0.46.1",
    "faster-whisper>=1.0",
    "qwen-vl-utils>=0.0.8",
    "tiktoken>=0.7",
    "datasets>=2.20",
    "pyannote.audio>=3.1",
    "soundfile>=0.12.1",

    # Vector Store
    "qdrant-client>=1.9",

    # Memory & Storage
    "redis>=5.0",
    "upstash-redis>=1.0",
    "pymongo>=4.6",

    # Retrieval
    "rank-bm25>=0.2",
    "PyStemmer>=2.0.1",

    # Agent Orchestration
    "langchain-core>=0.2",
    "langchain-text-splitters>=0.0.1",

    # Numerical & Scientific Computing
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pandas>=2.2",

    # Web Search & HTTP
    "tavily-python>=0.3",
    "httpx>=0.27",
    "requests>=2.31",

    # Resilience
    "tenacity>=8.2",
    "pybreaker>=1.0",

    # Image Processing — cairosvg/rawpy/mediapipe/pillow-heif are guarded by
    # try/except ImportError at their call sites and degrade gracefully.
    "pillow>=10.2",
    "opencv-python>=4.9",
    "pytesseract>=0.3",
    "easyocr>=1.7",
    "imagehash>=4.3",
    "cairosvg>=2.7",
    "rawpy>=0.21",
    "mediapipe>=0.10",
    "pillow-heif>=0.16",

    # Audio Processing — numba/llvmlite pinned for Python 3.12 compatibility.
    "pydub>=0.25",
    "numba>=0.59.0",
    "llvmlite>=0.42.0",
    "librosa>=0.10",
    "mutagen>=1.47",
    "tensorflow[and-cuda]>=2.16; sys_platform == 'linux'",
    "tensorflow>=2.16; sys_platform != 'linux'",
    "tensorflow-hub>=0.16",

    # Video Processing
    "av>=12.0",
    "imageio-ffmpeg>=0.4",
    "scenedetect[opencv]>=0.6",

    # Document Processing — camelot-py needs Ghostscript on PATH; guarded by
    # try/except ImportError, pdfplumber covers standard tables as fallback.
    "pdfplumber>=0.10",
    "pymupdf>=1.23",
    "camelot-py[cv]>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "chardet>=5.0",

    # Text Processing & NLP
    "ftfy>=6.1",
    "wordsegment>=1.3",
    "wordfreq>=3.0",
    "textstat>=0.7",
    "yake>=0.4",
    "keybert>=0.8",
    "lingua-language-detector>=2.0",

    # Serialization
    "orjson>=3.9",
    "PyYAML>=6.0",

    # Observability
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",

    # Security & PII Protection — python-magic-bin bundles the libmagic DLL
    # required on Windows. clamd and pyclamd are two independent ClamAV
    # client implementations used by separate malware-scan call sites in
    # this codebase (app/api/api_routes.py + app/ingestion/router.py use
    # clamd; app/pipeline/ingestion_pipeline.py uses pyclamd) — both required.
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.14; sys_platform != 'win32'",
    "bleach>=6.1",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",               # Presidio NLP engine; run: python -m spacy download en_core_web_lg
    "pyclamd>=0.4.0",
    "clamd>=1.0.2",
    "detoxify>=0.5",

    # Authentication
    "passlib[argon2]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "zxcvbn-python>=4.4.1",
    "authlib>=1.3.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    "google-auth>=2.29.0",
    "resend>=2.0.0",

    # System Utilities
    "psutil>=5.9",

    # Evaluation Harness — ragas pinned: 0.1.21 is the last version
    # compatible with the langchain constraint chain used by app/eval/judges/.
    # Do not bump casually; re-baseline the eval suite if upgraded.
    "ragas==0.1.21",
    "jiwer>=3.0.0",
    "mlflow>=2.10.0",
]


[project.optional-dependencies]

test = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",   # backs the --timeout=120 in [tool.pytest.ini_options]
    "pytest-randomly>=3.15", # NOT enabled by default (see `make test-randomized`) —
                             # available so order-dependence can be audited deliberately
    "httpx>=0.27",
]

# Formatters are UPPER-BOUNDED on purpose. A bare `black>=24.3` resolves to
# whatever is newest at CI time, so a new black release reformats files nobody
# touched and turns `black --check` red on an unrelated PR — which is exactly
# what happened (2026-08-07: CI had been green on 2026-08-03, then a newer
# black wanted to re-wrap 5 untouched files). A formatter's output IS the
# contract here, so its version belongs pinned to a major line. Bump these
# deliberately, in their own commit, so the reformat diff is reviewable on its
# own rather than buried inside a feature PR. `ruff check` (lint rules, not
# formatting) is far less prone to this, but is bounded for the same reason.
lint = [
    "black>=24.3,<27",
    "ruff>=0.4,<1",
    "isort>=5.13,<7",
]

typecheck = [
    "mypy>=1.9",
]

security = [
    "pip-audit>=2.7",    # dependency CVE scan (requirements.txt) — see .github/workflows/security.yml
    "bandit>=1.7",       # SAST — common Python vulnerability patterns in app/
    "pip-licenses>=4.4", # dependency license scan — flags copyleft/unknown licenses
]

# Quality & Performance Reporting — API contract testing (Schemathesis) and a
# second, independent LLM-eval framework (DeepEval) alongside the pinned Ragas
# harness above. Both open-source (MIT / Apache-2.0). k6/Lighthouse/OWASP ZAP/
# Uptime Kuma are external tools (Docker/binary), not pip deps — see perf/,
# lighthouserc.json, security/zap/, monitoring/uptime-kuma/.
quality = [
    # Upper-bounded deliberately. `>=3.35` was unbounded, so Schemathesis 4.x
    # installed itself into CI and removed the top-level `from_uri` loader that
    # tests/api_contract/test_schemathesis.py called -- a red PR with no code
    # change behind it. v4 is the target (that file uses the v4 API); the <5
    # ceiling is what stops the next major doing this again.
    "schemathesis>=4.24,<5",
    "deepeval>=1.4",
]

dev = [
    "MULTIMODAL-AGENTIC-RAG-INTEGRATED-KNOWLEDGE-AI-ASSISTANT[test,lint,typecheck,security,quality]",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]


[project.scripts]
# NOTE: "start-api" used to live here as
# start-api = "uvicorn app.main:app --reload" — invalid: [project.scripts]
# entries must be a `module:callable` Python entry-point reference (PEP 621),
# not a shell command with arguments, so `pip install -e .` failed to build
# with "must be python-entrypoint-reference" the moment anything actually
# tried to build this project as an editable install (nothing had, until
# now). Removed rather than papered over with a wrapper function — no
# documented workflow (see CLAUDE.md) ever invoked `start-api`; the real dev
# command is `uvicorn app.main:app --reload --port 8000` directly.
init-qdrant     = "app.vectorstore.qdrant_store:initialize_qdrant"
download-model  = "app.bin.models.download_all_models:main"


[tool.setuptools.packages.find]
where   = ["."]
include = ["app*"]
exclude = ["tests*", "notebooks*"]


# BLACK

[tool.black]
line-length             = 100
target-version          = ["py310", "py311"]
skip-string-normalization = true


# RUFF

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "T20",  # flake8-print (flag stray print statements)
]

ignore = [
    "E501",   # line length handled by black
    "B008",   # function calls in default args (FastAPI Depends pattern)
    "N806",   # variable in function should be lowercase (numpy convention)
    "T201",   # print found (allowed in scripts)
]

[tool.ruff.lint.per-file-ignores]
"tests/**"   = ["S101", "T201", "B011"]
"app/bin/**" = ["T201"]
# Standalone scripts: deliberately do `sys.path.insert(0, ROOT)` (and, in some
# cases, os.environ.setdefault(...) for an eval-only flag) before importing
# app.* — required so the script works when run directly (not as `python -m`),
# not movable to top-of-file without breaking that.
"app/eval/scripts/**"           = ["E402"]
"app/eval/datasets/build_gold_set.py" = ["E402"]
# main.py deliberately interleaves imports with app.add_middleware()/
# app.include_router() calls to control exact registration order, and sets
# HF_HOME env vars before the first transformers/torch import anywhere in the
# dependency chain — both real ordering requirements, not movable to the top.
"app/main.py" = ["E402"]
# ruff's isort port and the standalone `isort` tool (run separately in CI via
# `isort --check`) disagree on this file's specific pattern -- two plain
# imports from output_guard interleaved alphabetically with an aliased import
# from the same module (`check as _output_check`, aliased to avoid colliding
# with input_guard's own `check`). isort insists on splitting all three onto
# separate lines; ruff's I001 insists on recombining the two plain names.
# Deferring to isort's form (the actual CI-enforced formatter) and silencing
# ruff's I001 here rather than chasing a config that satisfies both.
"app/guardrails/__init__.py" = ["I001"]

[tool.ruff.lint.mccabe]
# Default is 10. Raised to 55 as a deliberate policy call: this codebase's
# per-modality dispatch functions (ingest/chunk/extract across 7 formats)
# are inherently branchy — one function orchestrating many format-specific
# paths — and a blanket rewrite to satisfy a generic threshold risks
# changing behavior in code with hard-won, eval-verified finance accuracy.
# 55 clears that inherent-complexity class. A handful of true outliers
# (66-184) remain above even this and are suppressed individually with
# `# noqa: C901` at the function, not hidden here, so they stay visible as
# known follow-up work instead of disappearing from view.
max-complexity = 55


# ISORT

[tool.isort]
profile     = "black"
line_length = 100


# PYTEST

[tool.pytest.ini_options]
pythonpath = ["."]
minversion = "8.0"
# --strict-config: fail loudly on any unrecognized ini option instead of
# silently ignoring it — this is what would have caught "aysncio_mode" (a
# typo'd, dead duplicate of asyncio_mode below) instead of it sitting there
# doing nothing.
# --disable-warnings intentionally removed: it was hiding ALL warnings
# repo-wide, including real ones (resource leaks, deprecations in your own
# code) mixed in with third-party noise. Warnings are visible again now —
# if a specific third-party warning turns out to be pure noise, add it to
# filterwarnings below by name rather than hiding everything again.
# --timeout=120: a hung test (stray network call, infinite loop) now fails
# after 2 minutes instead of hanging CI indefinitely. Generous on purpose —
# raise it if a genuinely slow (not hung) test needs more, don't lower it
# blindly.
# -p no:randomly: pytest-randomly (added for order-dependence auditing)
# auto-activates for EVERY run the moment it's installed — pytest loads all
# installed plugins by default, there is no "available but inactive" state.
# Disabled here so normal runs stay deterministic; `make test-randomized`
# re-enables it explicitly with `-p randomly` when you actually want to
# audit for hidden test-order dependencies.
addopts    = "--strict-markers --strict-config -q --tb=short --timeout=120 -p no:randomly"
testpaths  = ["tests"]

markers = [
    "unit: fast unit tests with no external dependencies",
    "integration: tests requiring live services (Qdrant, Redis, Mongo)",
    "slow: tests that take > 5 seconds",
    "multimodal: tests covering image/audio/video pipelines",
    "guardrails: Phase 26 security and injection defence tests",
    "auth: Phase 27 authentication and tenant-isolation tests",
]

asyncio_mode = "auto"


# MYPY

[tool.mypy]
python_version        = "3.10"
ignore_missing_imports = true
strict_optional       = true
warn_unused_ignores   = true
warn_redundant_casts  = true
warn_unused_configs   = true
no_implicit_optional  = true

[[tool.mypy.overrides]]
module = [
    "llama_cpp.*",
    "faster_whisper.*",
    "sentence_transformers.*",
    "rank_bm25.*",
    "pydub.*",
    "cv2.*",
    "pytesseract.*",
    "fitz.*",
    "pdfplumber.*",
    "docx.*",
    "openpyxl.*",
    "imagehash.*",
    "tavily.*",
    "upstash_redis.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "spacy.*",
    "yaml.*",
]
ignore_missing_imports = true


# COVERAGE

[tool.coverage.run]
branch  = true
source  = ["app"]
omit    = [
    "app/core/config.py",
    "tests/*",
    "app/bin/*",
]

[tool.coverage.report]
show_missing  = true
skip_empty    = true
fail_under    = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]


# BANDIT — SAST, see .github/workflows/security.yml
# Scope matches ruff/black/isort: app/ only (ui/ is JS, tests/ is test code
# where e.g. B101 assert-usage and hardcoded dummy passwords are expected).
[tool.bandit]
exclude_dirs = ["tests", "ui", ".venv", "rag_env"]
# B104 (bind-all-interfaces) and B108 (hardcoded tmp path) are noisy in a
# containerized app that's deliberately meant to bind 0.0.0.0 inside Docker
# and use predictable paths under a controlled /app tree — skip only these
# two, keep everything else (injection, weak crypto, eval/exec, etc.) live.
skips = ["B104", "B108"]
