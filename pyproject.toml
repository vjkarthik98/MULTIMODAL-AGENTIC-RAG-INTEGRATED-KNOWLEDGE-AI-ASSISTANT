[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name            = "multimodal-rag-assistant"
version         = "0.24.0"
description     = "Production Multimodal RAG + Agentic AI System — Phase 26"
readme          = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Your Name" }
]

keywords = [
    "rag", "multimodal", "llm", "agents",
    "retrieval", "embeddings", "qdrant", "mistral"
]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # WEB FRAMEWORK
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",

    # VALIDATION
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",

    # LLM
    "llama-cpp-python>=0.2.60",
    "huggingface_hub>=0.22",

    # EMBEDDINGS
    "torch>=2.2",
    "sentence-transformers>=2.7",
    "transformers>=4.39",
    "faster-whisper>=1.0",

    # VECTOR STORE
    "qdrant-client>=1.9",

    # MEMORY / STORAGE
    "redis>=5.0",
    "upstash-redis>=1.0",
    "pymongo>=4.6",

    # RETRIEVAL
    "rank-bm25>=0.2",

    # NUMERICAL
    "numpy>=1.26",
    "scikit-learn>=1.4",

    # WEB SEARCH
    "tavily-python>=0.3",
    "httpx>=0.27",

    # RESILIENCE
    "tenacity>=8.2",

    # IMAGE
    "pillow>=10.2",
    "opencv-python>=4.9",
    "pytesseract>=0.3",
    "imagehash>=4.3",

    # AUDIO
    "pydub>=0.25",

    # DOCUMENT
    "pdfplumber>=0.10",
    "pymupdf>=1.23",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "chardet>=5.0",

    # TEXT PROCESSING
    "langchain-text-splitters>=0.0.1",

    # SERIALIZATION
    "orjson>=3.9",

    # OBSERVABILITY
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",

    # SECURITY / GUARDRAILS — Phase 26
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",               # Presidio NLP engine; run: python -m spacy download en_core_web_lg
    "python-magic>=0.4.14",
    "bleach>=6.1",
    "PyYAML>=6.0",

    # SYSTEM
    "psutil>=5.9",
]


[project.optional-dependencies]

test = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

lint = [
    "black>=24.3",
    "ruff>=0.4",
    "isort>=5.13",
]

typecheck = [
    "mypy>=1.9",
]

dev = [
    "multimodal-rag-assistant[test,lint,typecheck]",
    "pre-commit>=3.7",
]

observability = [
    "langfuse>=2.0",
]


[project.scripts]
start-api       = "uvicorn app.main:app --reload"
init-qdrant     = "app.vectorstore.qdrant_store:initialize_qdrant"
download-model  = "app.bin.models.download_all_models:main"


[tool.setuptools.packages.find]
where   = ["."]
include = ["app*"]
exclude = ["tests*", "notebooks*"]


# BLACK

[tool.black]
line-length             = 100
target-version          = ["py310", "py311"]
skip-string-normalization = true


# RUFF

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "T20",  # flake8-print (flag stray print statements)
]

ignore = [
    "E501",   # line length handled by black
    "B008",   # function calls in default args (FastAPI Depends pattern)
    "N806",   # variable in function should be lowercase (numpy convention)
    "T201",   # print found (allowed in scripts)
]

[tool.ruff.lint.per-file-ignores]
"tests/**"   = ["S101", "T201", "B011"]
"app/bin/**" = ["T201"]


# ISORT

[tool.isort]
profile     = "black"
line_length = 100


# PYTEST

[tool.pytest.ini_options]
aysncio_mode = "auto"
pythonpath = ["."]
minversion = "8.0"
addopts    = "--strict-markers --disable-warnings -q --tb=short"
testpaths  = ["tests"]

markers = [
    "unit: fast unit tests with no external dependencies",
    "integration: tests requiring live services (Qdrant, Redis, Mongo)",
    "slow: tests that take > 5 seconds",
    "multimodal: tests covering image/audio/video pipelines",
    "guardrails: Phase 26 security and injection defence tests",
]

asyncio_mode = "auto"


# MYPY

[tool.mypy]
python_version        = "3.10"
ignore_missing_imports = true
strict_optional       = true
warn_unused_ignores   = true
warn_redundant_casts  = true
warn_unused_configs   = true
no_implicit_optional  = true

[[tool.mypy.overrides]]
module = [
    "llama_cpp.*",
    "faster_whisper.*",
    "sentence_transformers.*",
    "rank_bm25.*",
    "pydub.*",
    "cv2.*",
    "pytesseract.*",
    "fitz.*",
    "pdfplumber.*",
    "docx.*",
    "openpyxl.*",
    "imagehash.*",
    "tavily.*",
    "upstash_redis.*",
    "langfuse.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "spacy.*",
    "yaml.*",
]
ignore_missing_imports = true


# COVERAGE

[tool.coverage.run]
branch  = true
source  = ["app"]
omit    = [
    "app/core/config.py",
    "tests/*",
    "app/bin/*",
]

[tool.coverage.report]
show_missing  = true
skip_empty    = true
fail_under    = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]