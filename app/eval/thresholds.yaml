# Phase 32 — Agentic Answer Verification (docs/Phase_32_Agentic_Answer_Verification.md).
# No gate yet: these metrics require a baseline run of the verification loop
# itself (python -m app.eval.run --suite all, once VerificationLoop is wired
# into the runners) before a regression threshold can be set. Informational
# only until then — same pattern as the video/audio metrics above before
# their first baseline.
# First-ever `verification.*` reading (2026-08-13, hallucination-reduction
# initiative Phase 1) — the data existed since Phase 32 (VerificationReport
# computed on every query) but was silently dropped before reaching the eval
# report: AgentResponse/api_routes.py's flat_response never carried it. Now
# wired through query_pipeline.py -> api_routes.py flat_response["verification"]
# -> generation_runner.py's per-row capture -> _verification_metrics().
#
# SINGLE RUN (n=42, txt+pdf+docx, first query after a server restart —
# Phase 0 found restart-adjacent runs can be atypical either direction, so
# treat these as a first informational read, NOT a gate baseline. Phase 6
# does the real N=3-averaged baseline + gate, after Phases 2-5 land):
#   grounding_success_rate=0.9744 (n=39)  citation_accuracy_v2=0.8462 (n=39)
#   retry_success_rate=0.0000 (n=25, retried=25/39, eventually PASS=0)
#   avg_retry_count=0.7436 (n=39)
#   verification_latency_p50=6.09s  verification_latency_p95=13.62s (n=39)
# n=39 not 42: 3 rows had no VerificationReport (excluded, not failures — see
# _verification_metrics()'s docstring).
#
# TWO NOTABLE FINDINGS, not yet acted on (candidates for Phase 2/3 attention):
#  1. retry_success_rate=0.0000 — EVERY retried query (25/39) still failed
#     verification after exhausting all 4 retry strategies. ROOT-CAUSED (not
#     just observed): confidence_scorer.py::decide() (2026-08-13) requires
#     retrieval>=75 AND grounding>=90 AND citation>=95 AND overall>=90 AND
#     zero unsupported numbers AND zero bad citations AND 100% completeness
#     aspect coverage (all-or-nothing — the *score* gives partial credit for
#     completeness, but decide() does not) — ALL simultaneously. `overall =
#     0.6*weakest + 0.4*mean` means one middling dimension drags overall below
#     90 regardless of the other three: e.g. three perfect (100) dimensions
#     plus one at 80 -> overall=86, still FAIL. This is the same failure mode
#     already documented once for AGENT_VERIFY_RETRIEVAL_MIN (a demonstrably
#     correct answer permanently stuck FAIL at retrieval=80.5, fixed by
#     loosening 90->75) — grounding=90/citation=95/overall=90/completeness's
#     all-or-nothing rule never got the same empirical recalibration. Not a
#     retry-mechanism bug; a threshold-calibration gap across ALL FOUR gates
#     (plus completeness), broader than originally scoped. Phase 3 must
#     recalibrate all of AGENT_VERIFY_GROUNDING_MIN/CITATION_MIN/OVERALL_MIN
#     together (not just GROUNDING_MIN as first planned) against real score
#     distributions on known-good answers, and completeness's all-or-nothing
#     decide()-time rule should be reconsidered given the score already models
#     partial credit.
#  2. Splitting hallucination_rate (0.3810) into fabrication_rate=0.0952
#     (4/42) vs omission_rate=0.3095 (13/42) shows the blended metric was
#     mostly measuring omission, not fabrication — the model rarely invents
#     numbers; it much more often fails to state the specific figure the gold
#     reference expects. This argues for prioritizing retrieval/completeness
#     work (Phase 5's error_markers wiring, and beyond) over pure groundedness
#     scoring for the biggest hallucination_rate improvement, though Phase 3's
#     GPU groundedness scorer still matters for the smaller but higher-severity
#     fabrication_rate slice.

# 2026-08-13 UPDATE — post gate-recalibration (hallucination-reduction
# initiative Phase 3: NLI groundedness shipped + AGENT_VERIFY_RETRIEVAL_MIN
# 75->35, AGENT_VERIFY_OVERALL_MIN 90->50, completeness all-or-nothing
# auto-fail removed from confidence_scorer.py::decide() — see config.py's
# AGENT_VERIFY_* comments for the full evidence). Single validation run
# (n=39, txt+pdf+docx), NOT yet the N=3-averaged real baseline — that's
# Phase 6's job:
#   grounding_success_rate=0.9231  citation_accuracy_v2=0.8718
#   retry_success_rate=0.1818 (retried=11/39, eventually PASS=2 — WAS
#     0.0000/0/25-39 before recalibration; retries can now actually succeed)
#   avg_retry_count=0.2821 (WAS ~0.74-1.08 — most queries now pass on the
#     FIRST attempt instead of needlessly retrying against an unreachable bar)
#   verification_latency_p50=4.15s (WAS ~6.1-6.3s) p95=8.96s (WAS ~14s) —
#     fewer wasted retries is a real latency win, not just an accuracy one.
# citation_accuracy_v2 (0.87) still short of 1.0 — the same handful of
# citation=0.0/50.0 outlier rows flagged in config.py's AGENT_VERIFY_CITATION_MIN
# comment. Genuine CitationVerifier follow-up, not touched by this pass.
#
# 2026-08-13 UPDATE — post Phase 4 (three redundant hallucination detectors
# consolidated onto one shared implementation: reasoning_engine.generate_
# answer(), GroundednessChecker.check()/VerificationLoop, and output_guard.
# _check_groundedness() previously ran independent checks that could
# disagree; see app/verification/groundedness_checker.py::
# lexical_and_nli_verdict()). Re-ran the identical validation to confirm no
# regression from the consolidation itself:
#   grounding_success_rate=0.9231 (unchanged)  citation_accuracy_v2=0.8718 (unchanged)
#   verification_latency_p50=4.18s (WAS 4.15s)  p95=9.39s (WAS 8.96s) — the
#     "NLI now runs twice per verification attempt" cost this consolidation
#     introduces (once inside generate_answer(), once inside
#     GroundednessChecker.check()) turned out negligible in practice — NLI
#     inference is cheap relative to the LLM generation calls that dominate
#     total latency. hallucination_rate/fabrication_rate/omission_rate
#     identical (0.4286/0.0952/0.3810) — expected, since Phase 4 didn't
#     touch the eval metric, only the live detector implementations.
# Baseline v6 (verification.*, 2026-08-13, N=3-averaged, n=39, post Phases
# 1-5). Unlike generation's judge-scored metrics, these were IDENTICAL
# across all 3 runs (0.9231 / 0.8205 / 0.0833(1/12) / 0.3077 every time) —
# expected: VerificationLoop's scoring is deterministic given fixed
# retrieval + greedy/temp=0 generation, so N=3-averaging doesn't reduce
# variance here the way it can for judge-scored metrics; it's confirmation
# of stability, not noise reduction.
#
# GATING NOTE (found while wiring this up, 2026-08-13): a `gate_enabled` key
# HERE does nothing — app/eval/runner.py::check_thresholds() gates by SUITE
# NAME (`result.suite`, e.g. "generation" or "hallucination"), not by which
# top-level thresholds.yaml section a metric's threshold is defined under
# (_find_threshold() searches ALL sections by bare metric name regardless).
# There is no `--suite verification` CLI option, so these metrics only ever
# run under suite "generation" (informational — generation's own
# gate_enabled stays false, stale v3 baseline) or "hallucination" (gated —
# see below), depending on which `--suite` flag was used.
# generation_runner.py::run_hallucination_suite()'s metric filter was
# extended (2026-08-13) to also capture "fabrication"/"omission"/
# "grounding"/"retry"/"verification_latency", so `--suite hallucination`
# now carries every metric below and IS gated via the `hallucination:`
# section's `gate_enabled: true` above. `--suite generation` alone reports
# these as informational only.
verification:
  grounding_success_rate:
    min: 0.891  # v8 baseline 0.9384 * 0.95
    why: "Regression gate: 5% below v8 N=3-averaged all-7-modality baseline (0.9384, n=92, 2026-08-17). Fraction of answers with zero unsupported claims/numbers (GroundednessChecker). Raised from v7's 0.816 now that the xlsx NLI-premise defect (0.417 -> 0.917) is fixed — see the FIXED note above."
  citation_accuracy_v2:
    min: 0.816  # v8 baseline 0.8587 * 0.95
    why: "Regression gate: 5% below v8 N=3-averaged baseline (0.8587, n=92, 2026-08-17). Two real CitationVerifier bugs (multi-occurrence blindness, comma-number tokenization) were fixed this pass — see the FIXED note above — but the measured baseline itself came in slightly below v7's 0.8804, plausibly because the multi-occurrence fix is genuinely STRICTER on some rows the old first-occurrence-only check silently passed. Floor set from the ACTUAL new baseline, not left at v7's, since a MIN-type gate must track real measured behavior, not a hoped-for one."
  retry_success_rate:
    min: 0.177  # v8 baseline 0.1864 * 0.95
    why: "Regression gate: 5% below v8 N=3-averaged baseline (0.1864, n=92, 2026-08-17). Raised substantially from v7's 0.068 — the image skip_retries fix means fewer, more meaningful retries: retries that still happen are ones VerificationLoop couldn't already resolve deterministically, so a larger share of them now succeed. Context: across 140 retried sessions (v7-era), 88.6% changed nothing and only 1.4% flipped FAIL->PASS — this gate guards a mechanism that just got measurably less low-yield."
  avg_retry_count:
    why: "Mean verification retries per query — cost signal for the accuracy/latency tradeoff. v8 baseline 0.2898 (n=92, N=3-averaged), down from v7's 0.5000 — the image skip_retries fix (14/14 wasted retries -> ~1/14) is the main driver. No gate — cost signal, not a safety one."
  verification_latency_p50:
    why: "Median verification loop duration (retrieval+generate+verify, all attempts). v8 baseline 2.44s (n=92, N=3-averaged), down from v7's 4.42s — fewer wasted retries (avg_retry_count above) directly cuts latency. Bounded by AGENT_VERIFY_TIMEOUT_SEC=120.0s (config.py). No gate — latency varies with GPU contention, so a tight floor here would be flaky rather than informative; the existing latency.p95_sec.max=60.0 gate below already covers end-to-end regressions."
  verification_latency_p95:
    why: "Tail verification loop duration. v8 baseline 6.81s (n=92, N=3-averaged), down from v7's 11.07s — comfortably under both AGENT_VERIFY_TIMEOUT_SEC=120.0s and latency.p95_sec.max=60.0. No gate — same reasoning as verification_latency_p50."
