# Local hooks call the exact same tools/config as `make lint` and ci.yml —
# no separate pinned-version hook repos to drift out of sync with pyproject.toml.
# NOT installed as a git hook. `make install-dev` deliberately does not run
# `pre-commit install` — `git commit` must just commit, with no local gate.
# These checks are enforced in CI on every PR (.github/workflows/ci.yml).
# To run them here on demand: `make lint` or `pre-commit run --all-files`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
        require_serial: true

      - id: black
        name: black
        entry: black
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]

      # `stages: [manual]` — does NOT run on `git commit`, deliberately, and
      # it mirrors ci.yml's `continue-on-error: true` on its own mypy step.
      # app/ carries ~198 pre-existing type errors across 61 files (debt from
      # before these gates existed), so a blocking hook fails EVERY commit on
      # a known baseline. That doesn't get the baseline fixed — it gets the
      # hook bypassed with `git commit --no-verify`, which also skips
      # ruff/black/isort and puts formatting failures straight back into CI.
      # That is the exact loop this hook set exists to close. mypy still runs
      # on every PR (visible, red, non-blocking) and on demand locally via
      # `make typecheck` or `pre-commit run --hook-stage manual mypy`. Move it
      # back to the default stages in the same commit that gets the baseline
      # to zero — see docs/runbooks/phase29-plan.md workstream B.
      - id: mypy
        name: mypy (app/ only, manual stage)
        entry: mypy app/
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package-lock.json
