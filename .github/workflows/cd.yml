name: CD

# Tag-triggered staging→gate→promote pipeline:
#
#   1. wait-for-ci-green   confirm CI + Security both went green on this exact commit
#   2. build-push          build the production image once, push to GHCR
#   3. deploy-staging      SSM-deploy the image to the PRIVATE staging box
#                          (no public port, no Caddy — SSM is the only way in)
#   4. tier2-staging-gate  full Tier-2 RAG-quality suite AGAINST STAGING, blocking
#   5. promote-production  ONLY runs if tier2-staging-gate passed — deploys the
#                          SAME already-validated image to the real prod box
#
# If tier2-staging-gate fails: it alerts (Slack) and rolls staging back to its own
# previous image on a retrieval-section breach (see tier2-eval.yml) — production is
# never touched, because promote-production's `needs:` makes it skip automatically
# whenever a dependency fails. There is no separate "rollback" job for production:
# there is nothing to roll back, since nothing was deployed there.
#
# STAGING + PRODUCTION PREREQUISITES — REBUILT 2026-08-21 in a NEW AWS account
# (857194222592, was 537557168406) after the prior EC2 fleet + EBS volumes were
# manually deleted. Rebuilt via Terraform this time (deploy/aws/terraform/) —
# see its README section in docs/runbooks/phase-30-aws-deployment.md Appendix E
# for the full as-built resource list. Recorded here because every one of these
# is invisible from the repo alone, so a future failure in deploy-staging/
# tier2-staging-gate is almost certainly one of these having drifted:
#   1. Production: EC2 instance i-09831ac06b063d36f, Elastic IP 184.73.239.9,
#      tagged Name=magik-prod. Staging: EC2 instance i-09a14af803649d70d, no
#      Elastic IP (never needed one — resolved fresh by tag on every run),
#      tagged Name=magik-staging. Both g6e.xlarge in us-east-1a. These are
#      exactly what the `Resolve instance ID by tag` steps below look up
#      (vars.EC2_INSTANCE_TAG / vars.EC2_STAGING_INSTANCE_TAG default to
#      'magik-prod' / 'magik-staging' when the repo variable is unset).
#   2. EBS layout changed from the original single-volume design: each box now
#      has a dedicated 100GiB model-cache volume (mounted at
#      /opt/magik/.hf_cache) SEPARATE from the 100GiB root volume (OS, Docker,
#      /opt/magik/{data,logs,.env}) — see deploy/aws/scripts/bootstrap_instance.sh.
#      Staging's model volume was first cloned from a snapshot of production's
#      (matching the old clone-based design), but that hit EBS's snapshot
#      lazy-load penalty hard enough (scattered app reads capped near 5MB/s)
#      that it was rebuilt as a blank volume + direct HF download instead —
#      faster in practice, and what's actually live now. Both boxes downloaded
#      their own models directly; there is no clone relationship between them
#      going forward.
#   3. Security groups: magik-prod-sg (22 from an admin CIDR, 80/443 public),
#      magik-staging-sg (ZERO inbound rules, matching the design intent from
#      before — SSM is the only way in; the 127.0.0.1 port binding below is
#      the second, independent layer).
#   4. Instance profile: magik-ec2-role, one shared role/profile for both boxes
#      (deploy/aws/iam/ec2-instance-profile-permissions.json is not
#      prod-specific), created fresh by Terraform in the new account.
#   5. magik-deploy-role (GitHub OIDC) created fresh by Terraform
#      (deploy/aws/terraform/iam.tf), trust policy built from BOTH the
#      ID-qualified and legacy `sub` forms (same defensive pattern as the
#      original hand-maintained deploy/aws/iam/github-oidc-trust-policy.json,
#      now just Terraform-managed instead of a manual
#      `aws iam update-assume-role-policy`). Verified live 2026-08-21 against
#      `gh api .../actions/oidc/customization/sub` — this repo currently emits
#      the LEGACY (non-ID-qualified) subject format
#      (`use_immutable_subject: false`), and both forms are present regardless
#      so a future format flip on GitHub's side won't silently break this
#      again. GitHub repo variable AWS_DEPLOY_ROLE_ARN updated to point at the
#      new account's role.
#   6. Self-hosted runners re-registered from scratch: `magik-prod-runner`
#      (label `gpu`) and `magik-staging-runner` (label `staging-gpu`), both
#      installed as systemd services, confirmed Online in GitHub. Production's
#      runner goes `offline` whenever the box is stopped (idle-stop / manual
#      cost-saving stop) and comes back automatically when promote-production
#      wakes the instance (systemd service is enabled, starts on boot).
#   7. Repo variable SELF_HOSTED_STAGING_GPU_RUNNER=true (and
#      SELF_HOSTED_GPU_RUNNER=true). While false, tier2-staging-gate skips
#      cleanly rather than queueing forever — but that also means NOTHING
#      gates promotion, so it belongs "off" only during initial bring-up,
#      never in steady state.
#   8. Both boxes' BM25 index (data/users/<EVAL_USER_ID>/bm25_index/bm25.pkl,
#      required by tier2-eval.yml's own preflight) was rebuilt from Qdrant
#      payloads post-rebuild (no GPU/re-embedding needed — the vectors
#      themselves live in Qdrant Cloud, untouched by the AWS account change).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write   # OIDC — no static AWS credentials

# NOTE: there is deliberately no workflow-level `IMAGE: ghcr.io/${{ github.repository }}`.
# This repository's name contains UPPERCASE characters, and Docker/OCI reference
# syntax requires the repository path to be lowercase — `docker push` rejects
# anything else with "repository name must be lowercase". A workflow-level `env:`
# cannot run shell, and GitHub expressions have no lowercase function, so the
# image ref is computed once in build-push's `meta` step (via `tr`) and passed to
# the deploy jobs as a job output. Do not reintroduce the expression form.

jobs:
  # -----------------------------------------------------------------------
  # Gate 0 — "check all the things to get green" before building or deploying
  # anything. release.yml's version-bump commit lands on `main` moments before
  # the tag that triggers this workflow is pushed; ci.yml/security.yml fire on
  # that push as SEPARATE workflow runs that may still be in flight (or not yet
  # even registered) when this job starts. Poll the Checks/Actions API for the
  # exact commit SHA the tag points at until both conclude, and fail loudly if
  # either isn't a success — rather than silently building and deploying an
  # image whose lint/type/test/security status is unknown or red.
  # -----------------------------------------------------------------------
  wait-for-ci-green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for CI and Security workflows to go green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          for WF in "CI" "Security"; do
            echo "waiting for workflow '${WF}' on commit ${SHA} ..."
            DEADLINE=$(( SECONDS + 1200 ))
            STATUS=""
            CONCLUSION=""
            while [ "$SECONDS" -lt "$DEADLINE" ]; do
              LINE=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=20" \
                --jq ".workflow_runs[] | select(.name==\"${WF}\") | [.status,.conclusion] | @tsv" \
                2>/dev/null | head -1) || LINE=""
              STATUS="${LINE%%$'\t'*}"
              CONCLUSION="${LINE#*$'\t'}"
              [ "$LINE" = "" ] && { STATUS=""; CONCLUSION=""; }
              [ "$STATUS" = "completed" ] && break
              echo "  ... '${WF}' status=${STATUS:-not-found-yet} (${SECONDS}s elapsed)"
              sleep 15
            done
            if [ "$STATUS" != "completed" ]; then
              echo "::error title=CI gate timed out::Workflow '${WF}' did not report completed for commit ${SHA} within 20 minutes. See https://github.com/${REPO}/actions?query=workflow%3A%22${WF}%22"
              exit 1
            fi
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error title=CI gate failed::Workflow '${WF}' concluded '${CONCLUSION}' (not success) on commit ${SHA}. Fix it and push a new tag — this pipeline will not build or deploy an unverified commit."
              exit 1
            fi
            echo "'${WF}' is green."
          done

  build-push:
    needs: wait-for-ci-green
    runs-on: ubuntu-latest
    # Job-level override — must restate what the workflow-level block grants,
    # since a job-level `permissions:` replaces it wholesale rather than
    # merging. `security-events: write` is the addition: it's what lets
    # github/codeql-action/upload-sarif publish Trivy findings to the repo's
    # Security tab.
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # A hosted runner ships ~14GB free, but this is an nvidia/cuda image with
      # the full ML stack. On CD run #6 that was enough to BUILD and PUSH, then
      # Syft and Trivy both died with "no space left on device" trying to export
      # the image locally to scan it. Reclaiming the preinstalled toolchains we
      # never use frees ~25-30GB and costs about 30 seconds.
      - name: Free disk space on runner
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get clean || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "after:";  df -h / | tail -1

      # Docker/OCI requires a lowercase repository path, but this repo's name is
      # uppercase, so `ghcr.io/${{ github.repository }}` is an invalid reference
      # and `docker push` rejects it outright. Lowercase it here, once, and pass
      # it on as a job output — `tr` rather than bash's `${VAR,,}` so it does not
      # depend on the runner's shell being bash 4+.
      - id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compiling the CUDA wheel is a build-time step (nvcc cross-compiles
      # for sm_89, L40S/g6e.xlarge) — does not need a physical GPU, works
      # fine on this hosted runner. See Dockerfile's `cuda-builder` stage.
      #
      # sbom/provenance: buildkit attaches an SPDX SBOM and a SLSA provenance
      # attestation to the pushed image itself, so "what is actually inside
      # the artifact running in prod" is answerable from the registry alone
      # (`docker buildx imagetools inspect`), not reconstructed from the
      # Dockerfile. The standalone Syft step below additionally emits a
      # downloadable SBOM artifact for anyone without registry access.
      - uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_TAG=${{ steps.meta.outputs.tag }}
          # REGISTRY cache, not `type=gha`. The fixed-scope gha cache that used
          # to live here was measured doing active harm on v0.30.0:
          #
          #   * `#42 exporting to GitHub Actions Cache ... DONE 2872.4s` — 48
          #     minutes, over half of that job's 88-minute runtime, spent
          #     UPLOADING a cache.
          #   * ...that then produced ZERO `CACHED` layers on the next build.
          #     GitHub Actions Cache is capped at 10GB per repository; a
          #     `mode=max` export of a CUDA image with the full ML stack is many
          #     times that, so the manifest survives (the log shows `#17
          #     importing cache manifest from gha:...`) while the blobs it points
          #     at have already been LRU-evicted. A cache that imports cleanly
          #     and hits nothing is the worst of both worlds.
          #   * staging the export also consumed the runner's disk — 112GB free
          #     after the cleanup step above, and Trivy still died with "no space
          #     left on device" further down.
          #
          # GHCR has no such cap, dedupes against the image layers this same step
          # just pushed, and keeps the cache in exactly one place with exactly one
          # credential (the docker/login-action above). `image-manifest=true,
          # oci-mediatypes=true` are REQUIRED for GHCR — without them buildkit
          # writes a non-image manifest type that GHCR rejects.
          #
          # `:buildcache` is a real tag in the same GHCR package as the release
          # tags. That is intentional and normal; do not "clean it up".
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          sbom: true
          provenance: mode=max

      # The image is pushed and the build cache is in GHCR by this point, so
      # everything buildkit is still holding on local disk is dead weight — and
      # it is what starved Trivy on v0.30.0 ("no space left on device" with
      # 112GB free before the build started). Reclaim it here, between the push
      # and the two steps that need to unpack a ~20GB image locally.
      - name: Reclaim disk before scanning
        if: always()
        run: |
          echo "before:"; df -h / | tail -1
          docker buildx prune -af >/dev/null 2>&1 || true
          docker system prune -af --volumes >/dev/null 2>&1 || true
          echo "after:";  df -h / | tail -1

      # ── Supply-chain: SBOM artifact ──────────────────────────────────────
      # NON-BLOCKING, same treatment as the Trivy scan below: an SBOM is a
      # supply-chain/compliance artifact, not a release gate. Confirmed by a
      # real failure (2026-07-28): Syft errored scanning the freshly-pushed
      # image (exit code 1, cause not yet root-caused) and, lacking
      # continue-on-error, took down the ENTIRE job — deploy never ran even
      # though docker/build-push-action above had already succeeded and the
      # image was genuinely in GHCR. An SBOM generation hiccup must never
      # block shipping a working, already-built image.
      #
      # This EXTRACTS the SPDX attestation that `sbom: true` on the build step
      # above already attached to the pushed image, rather than re-deriving one
      # with Syft. anchore/sbom-action did the same job in 15 minutes (measured
      # on v0.30.0) by pulling and unpacking the whole ~20GB image a second
      # time — cost that bought nothing, since buildkit had already produced an
      # SBOM of the identical artifact during the build. imagetools reads it
      # straight out of the registry manifest in seconds and, unlike a fresh
      # scan, cannot disagree with what actually shipped.
      - name: Extract SBOM (SPDX JSON) from image attestation
        continue-on-error: true
        run: |
          set -uo pipefail
          IMG="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker buildx imagetools inspect "$IMG" \
            --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json || true
          # A missing/absent attestation yields the literal "null" or an empty
          # file. Drop it so the `hashFiles` guard below skips cleanly rather
          # than publishing a junk artifact named like a real SBOM.
          if [ ! -s sbom.spdx.json ] || [ "$(tr -d '[:space:]' < sbom.spdx.json)" = "null" ]; then
            echo "::warning title=SBOM::No SPDX attestation found on ${IMG}; skipping SBOM artifact."
            rm -f sbom.spdx.json
          else
            echo "SBOM extracted: $(wc -c < sbom.spdx.json) bytes"
          fi

      - name: Upload SBOM
        # Skip cleanly (grey) rather than fail-but-ignore (orange) when Syft
        # produced no file — keeps a green run genuinely green.
        if: hashFiles('sbom.spdx.json') != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sbom-${{ steps.meta.outputs.tag }}
          path: sbom.spdx.json
          retention-days: 90

      # ── Supply-chain: image vulnerability scan ───────────────────────────
      # NON-BLOCKING, and unlike security.yml's Bandit gate this one is
      # explicitly NOT calibrated against a measured baseline — the image has
      # never been built (no Docker on the dev machine; a CUDA image is far
      # too large/slow to build there just to count CVEs). Claiming a
      # threshold here would be guessing.
      #
      # Expect the first real run to report a substantial count: the base is
      # an nvidia/cuda image, and CUDA/Ubuntu bases habitually carry many
      # OS-level CVEs that have no upstream fix available. `ignore-unfixed:
      # true` already filters to *actionable* findings only (a CVE with a
      # patched version published), which is the number worth reacting to.
      #
      # TO CALIBRATE (do this on the first tagged build, alongside the AWS
      # bring-up): read the SARIF in the Security tab, confirm the CRITICAL
      # findings are genuinely unfixable base-image noise rather than
      # something we introduced, then set `exit-code: 1` with
      # `severity: CRITICAL` to make it a real gate.
      # Pinned to a v-prefixed tag: aquasecurity retired all non-"v" tags
      # (e.g. the old "0.24.0") following a supply-chain incident, and now
      # publishes only "vX.Y.Z" releases — an unprefixed tag no longer resolves.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # informational until calibrated — see note above
          # Vulnerability scanning ONLY. Trivy's secret scanner is on by
          # default and roughly doubles the layer extraction this step has to
          # do — for a check security.yml's `secrets-scan` job (detect-secrets
          # against .secrets.baseline) already performs on the source these
          # layers were built from. Trivy's own log recommends exactly this
          # flag. Halving the extraction also halves the disk footprint that
          # made this step fail on v0.30.0.
          scanners: vuln

      # Public repo, so GitHub code scanning is free — findings land in the
      # repo's Security tab with per-CVE history instead of being buried in
      # a job log nobody re-reads.
      #
      # `hashFiles` guard, matching the SBOM upload above: the scan step is
      # continue-on-error, so when it fails there is no SARIF to upload and
      # this step used to fail the job with a bare "Path does not exist:
      # trivy-results.sarif" (v0.30.0) — an error that says nothing about the
      # actual cause several steps earlier. Skip cleanly instead; the real
      # failure is already reported by the scan step itself.
      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  # -----------------------------------------------------------------------
  # STAGING — private box (no HTTP, no Caddy; SSM is the only way in). Same
  # image that will (conditionally) reach production, deployed here FIRST so
  # tier2-staging-gate below can evaluate it before anything user-facing sees it.
  # -----------------------------------------------------------------------
  deploy-staging:
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Resolve staging instance ID by tag
        id: instance
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ vars.EC2_STAGING_INSTANCE_TAG || 'magik-staging' }}" \
                      "Name=instance-state-name,Values=stopped,running,stopping" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "::error::No instance tagged Name=${{ vars.EC2_STAGING_INSTANCE_TAG || 'magik-staging' }} found. See docs/runbooks/ci-cd.md 'Staging gate' prerequisites."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      # Stopped-by-default for cost reasons, same as prod — waking an
      # already-running instance is a harmless no-op.
      - name: Wake staging instance (idempotent)
        run: aws ec2 start-instances --instance-ids ${{ steps.instance.outputs.id }} || true

      - name: Wait until running + SSM-reachable
        run: |
          aws ec2 wait instance-running --instance-ids ${{ steps.instance.outputs.id }}
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.instance.outputs.id }}" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "None")
            [ "$STATUS" = "Online" ] && break
            sleep 10
          done
          [ "$STATUS" = "Online" ] || { echo "::error::SSM agent not reachable after 5 min"; exit 1; }

      # Mirrors the production deploy script (see promote-production below) with
      # two deliberate differences: a staging-scoped docker network/redis
      # sidecar and distinct container names (magik-staging-current/-previous),
      # and — the "no HTTP, no Caddy" requirement — `-p 127.0.0.1:8000:8000`
      # instead of `-p 8000:8000`, so the app port is reachable only from
      # inside the box itself (SSM / docker exec), never from the network. The
      # staging box's security group is the second, independent layer
      # enforcing the same thing.
      #
      # HOST PATHS ARE /opt/magik ON BOTH BOXES — deliberately the same, not
      # a staging-specific path. An earlier revision used /opt/magik
      # "so it never collides with prod on a shared AMI image", which was
      # wrong on its own terms: these are two separate EC2 instances with
      # separate filesystems, so there was never a collision to avoid. The
      # cost was real though — staging is provisioned by cloning production
      # (AMI for the root volume, EBS snapshot for the data volume), so it
      # arrives with the models, .env and BM25 index already at /opt/magik.
      # Pointing at /opt/magik would have failed the preflight below
      # on a box that is, in fact, correctly provisioned.
      - name: Deploy via SSM (pull, swap, health check, auto-rollback)
        env:
          IMAGE_REF: ${{ needs.build-push.outputs.image }}:${{ needs.build-push.outputs.image_tag }}
          GH_OWNER: ${{ github.repository_owner }}
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          set -euo pipefail

          cat > /tmp/remote-deploy.sh <<'REMOTE_EOF'
          set -uo pipefail
          IMG="__IMAGE_REF__"
          OWNER="__GH_OWNER__"
          log(){ echo "[deploy-staging] $*"; }

          # ── Preflight: fail fast and legibly, BEFORE the multi-GB pull ─────
          command -v docker >/dev/null 2>&1 || { log "FATAL: docker not installed"; exit 1; }
          command -v aws    >/dev/null 2>&1 || { log "FATAL: aws cli not installed"; exit 1; }
          docker info >/dev/null 2>&1       || { log "FATAL: docker daemon unreachable"; exit 1; }
          for p in /opt/magik/.env /opt/magik/.hf_cache /opt/magik/data /opt/magik/logs; do
            [ -e "$p" ] || { log "FATAL: missing required path $p"; exit 1; }
          done
          if ! docker run --rm --gpus all nvidia/cuda:12.8.0-base-ubuntu22.04 nvidia-smi >/dev/null 2>&1; then
            log "FATAL: '--gpus all' not functional — nvidia-container-toolkit missing/broken"
            exit 1
          fi
          log "preflight OK"

          # ── Reclaim disk BEFORE pulling ~20GB ─────────────────────────────
          disk_free_gb(){ df -BG --output=avail / | tail -1 | tr -dc '0-9'; }
          log "disk free before cleanup: $(disk_free_gb)GB"

          docker image prune -f >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          log "disk free after safe prune: $(disk_free_gb)GB"

          if [ "$(disk_free_gb)" -lt 40 ]; then
            log "under 40GB — dropping the rollback container to reclaim its image"
            docker rm -f magik-staging-previous >/dev/null 2>&1 || true
            docker image prune -af >/dev/null 2>&1 || true
            log "disk free after full prune: $(disk_free_gb)GB"
          fi

          FREE_GB="$(disk_free_gb)"
          if [ "${FREE_GB:-0}" -lt 30 ]; then
            log "FATAL: only ${FREE_GB}GB free on / after cleanup; this image needs ~25GB to unpack."
            df -h / || true
            du -sh /opt/magik/* 2>/dev/null | sort -rh | head -10 || true
            docker system df || true
            exit 1
          fi
          log "disk OK — ${FREE_GB}GB free"

          # ── Pull BEFORE touching the running container ─────────────────────
          GHCR_PAT="$(aws ssm get-parameter --name /magik/ghcr_pat \
                        --with-decryption --query Parameter.Value --output text)" \
            || { log "FATAL: could not read /magik/ghcr_pat from SSM"; exit 1; }
          echo "$GHCR_PAT" | docker login ghcr.io -u "$OWNER" --password-stdin \
            || { log "FATAL: docker login to ghcr.io failed"; exit 1; }
          log "pulling $IMG (multi-GB, several minutes expected)"
          docker pull "$IMG" || { log "FATAL: docker pull failed"; exit 1; }

          # ── Committed non-secret deploy config (deploy/aws/staging.env) ────
          echo "__STAGING_ENV_B64__" | base64 -d > /opt/magik/.env.prod
          log "staging.env config written"

          # ── App secrets from SSM (same 9 as production — see
          #    deploy/aws/README.md 'App secrets in SSM'; staging shares the
          #    real Qdrant/Redis/Mongo services, isolated by EVAL_USER_ID
          #    tenant scoping the same way Tier-2 already relies on) ─────────
          SECRETS_ENV="/opt/magik/.env.secrets"
          rm -f "$SECRETS_ENV"
          : > "$SECRETS_ENV"
          chmod 600 "$SECRETS_ENV"
          SECRETS_OK="yes"
          for PARAM_KEY in \
            "google_client_secret:GOOGLE_CLIENT_SECRET" \
            "smtp_password:SMTP_PASSWORD" \
            "secret_key:SECRET_KEY" \
            "jwt_secret_key:JWT_SECRET_KEY" \
            "mongo_uri:MONGO_URI" \
            "qdrant_api_key:QDRANT_API_KEY" \
            "redis_token:REDIS_TOKEN" \
            "hf_token:HF_TOKEN" \
            "tavily_api_key:TAVILY_API_KEY"
          do
            SSM_NAME="${PARAM_KEY%%:*}"
            ENV_KEY="${PARAM_KEY##*:}"
            VAL="$(aws ssm get-parameter --name "/magik/${SSM_NAME}" \
                     --with-decryption --query Parameter.Value --output text 2>/dev/null)" \
              || { log "FATAL: could not read /magik/${SSM_NAME} from SSM"; SECRETS_OK="no"; break; }
            echo "${ENV_KEY}=${VAL}" >> "$SECRETS_ENV"
          done
          if [ "$SECRETS_OK" != "yes" ]; then
            rm -f "$SECRETS_ENV"
            log "FATAL: app-secrets fetch from SSM failed — see deploy/aws/README.md 'App secrets in SSM'"
            exit 1
          fi
          log "app secrets fetched from SSM (9/9)"

          # ── Local cache sidecar (staging-scoped name/network) ──────────────
          docker network create magik-staging-net >/dev/null 2>&1 || true
          if ! docker ps --filter name=magik-staging-redis --filter status=running -q | grep -q .; then
            docker rm -f magik-staging-redis >/dev/null 2>&1 || true
            docker run -d --name magik-staging-redis \
              --network magik-staging-net --restart unless-stopped \
              --log-opt max-size=10m --log-opt max-file=2 \
              redis:7-alpine redis-server \
                --save "" --appendonly no \
                --maxmemory 512mb --maxmemory-policy allkeys-lru \
              || { log "FATAL: could not start magik-staging-redis sidecar"; exit 1; }
            log "started magik-staging-redis sidecar"
          else
            docker network connect magik-staging-net magik-staging-redis >/dev/null 2>&1 || true
            log "magik-staging-redis already running"
          fi

          # ── Swap ──────────────────────────────────────────────────────────
          docker rm -f magik-staging-previous >/dev/null 2>&1 || true
          docker stop -t 30 magik-staging-current >/dev/null 2>&1 || true
          docker rename magik-staging-current magik-staging-previous >/dev/null 2>&1 || true

          # -p 127.0.0.1:8000:8000 — NOT 0.0.0.0:8000 — is the "no HTTP, no
          # Caddy" requirement enforced at the docker layer: nothing outside
          # this box can reach the app port even if the security group ever
          # regresses. --env-file ordering: later wins, same as production.
          docker run -d --name magik-staging-current \
            --gpus all --restart unless-stopped \
            --network magik-staging-net \
            --shm-size=2g \
            --log-opt max-size=50m --log-opt max-file=3 \
            -p 127.0.0.1:8000:8000 \
            --env-file /opt/magik/.env \
            --env-file /opt/magik/.env.prod \
            --env-file "$SECRETS_ENV" \
            -e LOCAL_CACHE_HOST=magik-staging-redis \
            -e TORCH_HOME=/app/.hf_cache/torch \
            -v /opt/magik/.hf_cache:/app/.hf_cache \
            -v /opt/magik/data:/app/data \
            -v /opt/magik/logs:/app/logs \
            "$IMG"
          RUN_STATUS=$?
          rm -f "$SECRETS_ENV"
          if [ "$RUN_STATUS" -ne 0 ]; then
            log "FATAL: docker run failed (port 8000 already held by a non-container process?)"
            docker rename magik-staging-previous magik-staging-current >/dev/null 2>&1 || true
            docker start magik-staging-current >/dev/null 2>&1 || true
            exit 1
          fi

          # ── Health check ──────────────────────────────────────────────────
          log "waiting for /health (up to 20 min for cold model load)"
          for i in $(seq 1 80); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              log "HEALTHY after $(( i * 15 ))s"
              docker ps --filter name=magik-staging-current --format '{{.Names}} {{.Status}}'
              exit 0
            fi
            if ! docker ps -q --filter name=magik-staging-current --filter status=running | grep -q .; then
              log "FATAL: container exited during startup — last 80 log lines:"
              docker logs --tail 80 magik-staging-current 2>&1 || true
              break
            fi
            sleep 15
          done

          log "DEPLOY_HEALTHCHECK_FAILED — last 80 log lines:"
          docker logs --tail 80 magik-staging-current 2>&1 || true
          docker rm -f magik-staging-current >/dev/null 2>&1 || true
          docker rename magik-staging-previous magik-staging-current >/dev/null 2>&1 || true
          docker start magik-staging-current >/dev/null 2>&1 || true
          exit 1
          REMOTE_EOF

          STAGING_ENV_B64="$(base64 -w0 deploy/aws/staging.env)"

          sed -i "s|__IMAGE_REF__|${IMAGE_REF}|g; s|__GH_OWNER__|${GH_OWNER}|g; s|__STAGING_ENV_B64__|${STAGING_ENV_B64}|g" /tmp/remote-deploy.sh
          SCRIPT_B64="$(base64 -w0 /tmp/remote-deploy.sh)"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "magik staging deploy ${{ needs.build-push.outputs.image_tag }}" \
            --timeout-seconds 600 \
            --parameters "{\"commands\":[\"echo $SCRIPT_B64 | base64 -d > /tmp/msd.sh\",\"bash /tmp/msd.sh\"],\"executionTimeout\":[\"3600\"]}" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          DEADLINE=$(( SECONDS + 2400 ))
          STATUS="Pending"
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            echo "  ... $STATUS ($SECONDS s elapsed)"
            sleep 15
          done

          echo "=== remote stdout ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text 2>/dev/null || true
          echo "=== remote stderr ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text 2>/dev/null || true

          [ "$STATUS" = "Success" ] || { echo "::error::SSM staging deploy finished with status: $STATUS"; exit 1; }

      - name: Post deploy summary
        if: always()
        run: |
          echo "## Staging deploy — ${{ needs.build-push.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instance: ${{ steps.instance.outputs.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure (Slack, optional)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"text\": \"MAGIK STAGING deploy of ${{ needs.build-push.outputs.image_tag }} FAILED — production was never touched. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

  # -----------------------------------------------------------------------
  # BLOCKING gate — full Tier-2 suite against staging. promote-production
  # below `needs` this job, so a failure here (including a timeout, crash, or
  # a scored retrieval-section breach) leaves promote-production SKIPPED —
  # production is never deployed. See tier2-eval.yml for the eval/rollback
  # logic itself (shared with the nightly informational run against prod).
  # -----------------------------------------------------------------------
  tier2-staging-gate:
    needs: deploy-staging
    uses: ./.github/workflows/tier2-eval.yml
    secrets: inherit  # pragma: allowlist secret
    with:
      container: magik-staging-current
      previous_container: magik-staging-previous
      runner_label: staging-gpu
      environment_label: staging
      runner_available: ${{ vars.SELF_HOSTED_STAGING_GPU_RUNNER == 'true' }}

  # -----------------------------------------------------------------------
  # Stop staging the moment we're done with it — deterministic, not the
  # idle-stop Lambda's NetworkIn heuristic (which only ever watches
  # magik-prod; staging carries zero real user traffic for that heuristic to
  # measure anyway). deploy-staging wakes staging unconditionally; until this
  # job existed, nothing ever stopped it again — it would run (and bill)
  # indefinitely after every single tagged deploy. `if: always()` so this
  # still runs whether tier2-staging-gate passed, failed, or was skipped
  # (SELF_HOSTED_STAGING_GPU_RUNNER != 'true') — we're done with the box
  # either way once this point is reached.
  # -----------------------------------------------------------------------
  stop-staging:
    needs: [deploy-staging, tier2-staging-gate]
    if: always()
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Resolve staging instance ID by tag
        id: instance
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ vars.EC2_STAGING_INSTANCE_TAG || 'magik-staging' }}" \
                      "Name=instance-state-name,Values=running,pending" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Stop staging instance
        if: steps.instance.outputs.id != '' && steps.instance.outputs.id != 'None'
        run: aws ec2 stop-instances --instance-ids ${{ steps.instance.outputs.id }}

  # -----------------------------------------------------------------------
  # PRODUCTION — the champion→successor swap. Only reachable if
  # tier2-staging-gate succeeded (default `needs` semantics: this job is
  # skipped, not run, whenever a dependency fails) — so a bad Tier-2 result on
  # staging makes this a no-op by construction, no extra `if:` required.
  # Deploys the EXACT image tag already built once in build-push and already
  # validated on staging — never rebuilt, never re-tagged.
  # -----------------------------------------------------------------------
  promote-production:
    needs: [build-push, tier2-staging-gate]
    runs-on: ubuntu-latest
    environment: production
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Resolve instance ID by tag
        id: instance
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ vars.EC2_INSTANCE_TAG || 'magik-prod' }}" \
                      "Name=instance-state-name,Values=stopped,running,stopping" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "::error::No instance tagged Name=${{ vars.EC2_INSTANCE_TAG || 'magik-prod' }} found. See docs/runbooks/ci-cd.md prerequisites."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      # ADR-5 (Phase 30 scale-to-zero): the box is stopped-by-default for
      # cost reasons — this must not assume it's already running.
      # start-instances on an already-running instance is a harmless no-op.
      - name: Wake instance (idempotent)
        run: aws ec2 start-instances --instance-ids ${{ steps.instance.outputs.id }} || true

      - name: Wait until running + SSM-reachable
        run: |
          aws ec2 wait instance-running --instance-ids ${{ steps.instance.outputs.id }}
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.instance.outputs.id }}" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "None")
            [ "$STATUS" = "Online" ] && break
            sleep 10
          done
          [ "$STATUS" = "Online" ] || { echo "::error::SSM agent not reachable after 5 min"; exit 1; }

      # Keeps the previous container renamed (not removed) so failure can
      # roll back instantly instead of re-pulling an old image.
      #
      # The remote script is authored as a normal shell script here, then
      # base64-encoded into ONE SSM command. The previous inline JSON-array
      # form required hand-escaping quotes and `$` through two layers (YAML →
      # JSON → shell), which is a standing source of silent breakage; this
      # form has exactly one quoting boundary.
      - name: Deploy via SSM (pull, swap, health check, auto-rollback)
        id: deploy
        env:
          IMAGE_REF: ${{ needs.build-push.outputs.image }}:${{ needs.build-push.outputs.image_tag }}
          GH_OWNER: ${{ github.repository_owner }}
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          set -euo pipefail

          cat > /tmp/remote-deploy.sh <<'REMOTE_EOF'
          set -uo pipefail
          IMG="__IMAGE_REF__"
          OWNER="__GH_OWNER__"
          log(){ echo "[deploy] $*"; }

          # ── Preflight: fail fast and legibly, BEFORE the multi-GB pull ─────
          command -v docker >/dev/null 2>&1 || { log "FATAL: docker not installed"; exit 1; }
          command -v aws    >/dev/null 2>&1 || { log "FATAL: aws cli not installed"; exit 1; }
          docker info >/dev/null 2>&1       || { log "FATAL: docker daemon unreachable"; exit 1; }
          for p in /opt/magik/.env /opt/magik/.hf_cache /opt/magik/data /opt/magik/logs; do
            [ -e "$p" ] || { log "FATAL: missing required path $p"; exit 1; }
          done
          if ! docker run --rm --gpus all nvidia/cuda:12.8.0-base-ubuntu22.04 nvidia-smi >/dev/null 2>&1; then
            log "FATAL: '--gpus all' not functional — nvidia-container-toolkit missing/broken"
            exit 1
          fi
          log "preflight OK"

          # ── Reclaim disk BEFORE pulling ~20GB ─────────────────────────────
          # Every release leaves another multi-GB CUDA image behind and nothing
          # ever collected them. On the v0.27.0 deploy the root volume filled
          # and `docker pull` died mid-write with "no space left on device"
          # after the build had already spent an hour — the single most
          # expensive way to discover a full disk.
          #
          # Staged, least-destructive-first: dangling layers and build cache go
          # unconditionally (nothing can want them), and the rollback image is
          # only sacrificed if that was not enough. Losing instant rollback is
          # strictly better than a deploy that cannot start.
          disk_free_gb(){ df -BG --output=avail / | tail -1 | tr -dc '0-9'; }
          log "disk free before cleanup: $(disk_free_gb)GB"

          docker image prune -f >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          log "disk free after safe prune: $(disk_free_gb)GB"

          if [ "$(disk_free_gb)" -lt 40 ]; then
            log "under 40GB — dropping the rollback container to reclaim its image"
            docker rm -f magik-previous >/dev/null 2>&1 || true
            # -a removes every image no RUNNING container references. The image
            # behind magik-current is therefore retained.
            docker image prune -af >/dev/null 2>&1 || true
            log "disk free after full prune: $(disk_free_gb)GB"
          fi

          # Fail fast and legibly rather than 8 minutes into a doomed pull.
          FREE_GB="$(disk_free_gb)"
          if [ "${FREE_GB:-0}" -lt 30 ]; then
            log "FATAL: only ${FREE_GB}GB free on / after cleanup; this image needs ~25GB to unpack."
            log "Grow the EBS volume (growpart + resize2fs) or clear /opt/magik. Largest consumers:"
            df -h / || true
            du -sh /opt/magik/* 2>/dev/null | sort -rh | head -10 || true
            docker system df || true
            exit 1
          fi
          log "disk OK — ${FREE_GB}GB free"

          # ── Pull BEFORE touching the running container, so a failed pull
          #    never takes down a working service ───────────────────────────
          GHCR_PAT="$(aws ssm get-parameter --name /magik/ghcr_pat \
                        --with-decryption --query Parameter.Value --output text)" \
            || { log "FATAL: could not read /magik/ghcr_pat from SSM"; exit 1; }
          echo "$GHCR_PAT" | docker login ghcr.io -u "$OWNER" --password-stdin \
            || { log "FATAL: docker login to ghcr.io failed"; exit 1; }
          log "pulling $IMG (multi-GB, several minutes expected)"
          docker pull "$IMG" || { log "FATAL: docker pull failed"; exit 1; }

          # ── Committed non-secret deploy config (deploy/aws/prod.env) ───────
          # GRAFANA_ROOT_URL, NTFY_WEBHOOK_URL, VRAM_BUDGET_GB — previously
          # hand-edited directly on the box (v0.28.0 Known Issue), which let
          # them drift out of sync with what's actually committed. This file
          # is now the single source of truth; every deploy overwrites
          # /opt/magik/.env.prod with it, so a stale hand-edit here can't
          # persist past the next tag push.
          echo "__PROD_ENV_B64__" | base64 -d > /opt/magik/.env.prod
          log "prod.env config written"

          # ── App secrets from SSM (Phase 31 — project memory
          #    "secrets-management-gap") ───────────────────────────────────
          # These nine used to live as plaintext in /opt/magik/.env
          # indefinitely (the original five, plus four more — QDRANT_API_KEY,
          # REDIS_TOKEN, HF_TOKEN, TAVILY_API_KEY — added in the same pass
          # that also corrected GOOGLE_CLIENT_ID's miscategorization: OAuth
          # client IDs are public by design, only the matching _SECRET is
          # confidential, so GOOGLE_CLIENT_ID stays in prod.env, not here).
          # GRAFANA_ADMIN_PASSWORD and NTFY_WEBHOOK_URL are ALSO real secrets
          # from that same audit, but deliberately NOT in this loop — they're
          # consumed by the separately-deployed monitoring stack
          # (docker-compose.monitoring.yml), not this app container, so they
          # need their own fetch mechanism, not this one.
          #
          # They now come from SSM SecureString on every deploy, written to
          # a freshly-generated, 0600, never-committed env file that outlives
          # only this docker run — deleted immediately after, success or
          # failure, so the plaintext window on disk is this script's
          # runtime, not "forever". The IAM policy this role runs under
          # (deploy/aws/iam/ec2-instance-profile-permissions.json) scopes
          # ssm:GetParameter to exactly these nine ARNs plus /magik/ghcr_pat
          # above — nothing else in Parameter Store is reachable from this
          # box.
          #
          # One-time setup (not run by this script): seed the nine values
          # with `aws ssm put-parameter --type SecureString`, documented in
          # deploy/aws/README.md's "App secrets in SSM" section — this
          # script only ever READS them.
          SECRETS_ENV="/opt/magik/.env.secrets"
          rm -f "$SECRETS_ENV"
          : > "$SECRETS_ENV"
          chmod 600 "$SECRETS_ENV"
          SECRETS_OK="yes"
          for PARAM_KEY in \
            "google_client_secret:GOOGLE_CLIENT_SECRET" \
            "smtp_password:SMTP_PASSWORD" \
            "secret_key:SECRET_KEY" \
            "jwt_secret_key:JWT_SECRET_KEY" \
            "mongo_uri:MONGO_URI" \
            "qdrant_api_key:QDRANT_API_KEY" \
            "redis_token:REDIS_TOKEN" \
            "hf_token:HF_TOKEN" \
            "tavily_api_key:TAVILY_API_KEY"
          do
            SSM_NAME="${PARAM_KEY%%:*}"
            ENV_KEY="${PARAM_KEY##*:}"
            VAL="$(aws ssm get-parameter --name "/magik/${SSM_NAME}" \
                     --with-decryption --query Parameter.Value --output text 2>/dev/null)" \
              || { log "FATAL: could not read /magik/${SSM_NAME} from SSM"; SECRETS_OK="no"; break; }
            echo "${ENV_KEY}=${VAL}" >> "$SECRETS_ENV"
          done
          if [ "$SECRETS_OK" != "yes" ]; then
            rm -f "$SECRETS_ENV"
            log "FATAL: app-secrets fetch from SSM failed — see deploy/aws/README.md 'App secrets in SSM'"
            exit 1
          fi
          log "app secrets fetched from SSM (9/9)"

          # ── Local cache sidecar ───────────────────────────────────────────
          # app/core/infra_registry.py::get_cache() backs ingestion job status,
          # the JWT blacklist, the embedding cache and per-user rate limits. It
          # dials settings.LOCAL_CACHE_HOST, which defaults to "localhost" —
          # and inside a container "localhost" is the CONTAINER, not the host.
          # Without a reachable Redis, get_cache() returns None and every caller
          # degrades: job-status polls 404 (breaking UI upload progress) and
          # app/auth/rate_limit.py FAILS OPEN, which on a public demo removes
          # the only guard against someone hammering a $1.86/hr GPU.
          #
          # A sidecar on a user-defined network fixes it without touching
          # /opt/magik/.env — the -e below overrides the env-file, so running
          # from source on the host (where localhost IS correct) still works.
          docker network create magik-net >/dev/null 2>&1 || true
          if ! docker ps --filter name=magik-redis --filter status=running -q | grep -q .; then
            docker rm -f magik-redis >/dev/null 2>&1 || true
            # Ephemeral by design: no persistence, bounded memory, LRU eviction.
            docker run -d --name magik-redis \
              --network magik-net --restart unless-stopped \
              --log-opt max-size=10m --log-opt max-file=2 \
              redis:7-alpine redis-server \
                --save "" --appendonly no \
                --maxmemory 512mb --maxmemory-policy allkeys-lru \
              || { log "FATAL: could not start magik-redis sidecar"; exit 1; }
            log "started magik-redis sidecar"
          else
            docker network connect magik-net magik-redis >/dev/null 2>&1 || true
            log "magik-redis already running"
          fi

          # ── Swap ──────────────────────────────────────────────────────────
          docker rm -f magik-previous >/dev/null 2>&1 || true
          # STOP before rename. `docker rename` does NOT stop a container — it
          # keeps running and keeps its port binding, so the `docker run` below
          # then dies with "Bind for 0.0.0.0:8000 failed: port is already
          # allocated". This is invisible on a first deploy (no magik-current
          # exists, rename is a no-op) and breaks every deploy after it, which
          # is exactly how it reached production: run #8 was green, v0.27.0
          # failed here. Stopped — not removed — so the rollback path below can
          # still bring it back with `docker start`.
          docker stop -t 30 magik-current >/dev/null 2>&1 || true
          docker rename magik-current magik-previous >/dev/null 2>&1 || true

          # --shm-size: torch dataloaders/multiprocessing outgrow the 64MB default.
          # --log-opt:  cap container logs; this box has already hit a full disk once.
          # --env-file ordering — Docker applies later --env-file values last,
          # so each layer wins over the one before it:
          #   .env          → the long-lived, box-local file (legacy/manual values)
          #   .env.prod     → committed deploy/aws/prod.env, rewritten every
          #                   deploy, so it always wins over a stale hand-edit
          #                   still sitting in .env (see deploy/aws/README.md)
          #   $SECRETS_ENV  → the five SSM-sourced secrets, always win last
          docker run -d --name magik-current \
            --gpus all --restart unless-stopped \
            --network magik-net \
            --shm-size=2g \
            --log-opt max-size=50m --log-opt max-file=3 \
            -p 8000:8000 \
            --env-file /opt/magik/.env \
            --env-file /opt/magik/.env.prod \
            --env-file "$SECRETS_ENV" \
            -e LOCAL_CACHE_HOST=magik-redis \
            -e TORCH_HOME=/app/.hf_cache/torch \
            -v /opt/magik/.hf_cache:/app/.hf_cache \
            -v /opt/magik/data:/app/data \
            -v /opt/magik/logs:/app/logs \
            "$IMG"
          RUN_STATUS=$?
          # --env-file is read once at container-create time and baked into the
          # container's env from here on — the file has no further purpose
          # whether the run above succeeded or failed. Shrink the plaintext
          # window on disk to as close to zero as possible.
          rm -f "$SECRETS_ENV"
          if [ "$RUN_STATUS" -ne 0 ]; then
            log "FATAL: docker run failed (port 8000 already held by a non-container process?)"
            docker rename magik-previous magik-current >/dev/null 2>&1 || true
            docker start magik-current >/dev/null 2>&1 || true
            exit 1
          fi

          # ── Health check ──────────────────────────────────────────────────
          # 80 x 15s = 20 min. A cold start pages ~18GB of models off EBS
          # (measured ~139 MB/s on this box) and warms llama-server on the GPU;
          # the previous 5-minute window could not cover that.
          log "waiting for /health (up to 20 min for cold model load)"
          for i in $(seq 1 80); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              log "HEALTHY after $(( i * 15 ))s"
              docker ps --filter name=magik-current --format '{{.Names}} {{.Status}}'
              exit 0
            fi
            if ! docker ps -q --filter name=magik-current --filter status=running | grep -q .; then
              log "FATAL: container exited during startup — last 80 log lines:"
              docker logs --tail 80 magik-current 2>&1 || true
              break
            fi
            sleep 15
          done

          log "DEPLOY_HEALTHCHECK_FAILED — last 80 log lines:"
          docker logs --tail 80 magik-current 2>&1 || true
          docker rm -f magik-current >/dev/null 2>&1 || true
          docker rename magik-previous magik-current >/dev/null 2>&1 || true
          docker start magik-current >/dev/null 2>&1 || true
          exit 1
          REMOTE_EOF

          # deploy/aws/prod.env is committed and checked out right here on the
          # runner — base64 it whole so its contents survive the same single
          # quoting boundary as IMAGE_REF/GH_OWNER below, then substitute it
          # in like any other placeholder. No new escaping rules to get wrong.
          PROD_ENV_B64="$(base64 -w0 deploy/aws/prod.env)"

          sed -i "s|__IMAGE_REF__|${IMAGE_REF}|g; s|__GH_OWNER__|${GH_OWNER}|g; s|__PROD_ENV_B64__|${PROD_ENV_B64}|g" /tmp/remote-deploy.sh
          SCRIPT_B64="$(base64 -w0 /tmp/remote-deploy.sh)"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "magik deploy ${{ needs.build-push.outputs.image_tag }}" \
            --timeout-seconds 600 \
            --parameters "{\"commands\":[\"echo $SCRIPT_B64 | base64 -d > /tmp/md.sh\",\"bash /tmp/md.sh\"],\"executionTimeout\":[\"3600\"]}" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          # Poll manually: the built-in `aws ssm wait command-executed` waiter
          # is fixed at 20 attempts x 5s = 100s, which cannot cover a multi-GB
          # pull plus cold model load. 40-minute cap here instead.
          DEADLINE=$(( SECONDS + 2400 ))
          STATUS="Pending"
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            echo "  ... $STATUS ($SECONDS s elapsed)"
            sleep 15
          done

          echo "=== remote stdout ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text 2>/dev/null || true
          echo "=== remote stderr ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text 2>/dev/null || true

          [ "$STATUS" = "Success" ] || { echo "::error::SSM deploy finished with status: $STATUS"; exit 1; }

      # ── Monitoring stack (Prometheus/Grafana/Tempo/Loki/OTel) ────────────
      # Deliberately AFTER the app-container step above and gated on nothing
      # but `always()` + its own `continue-on-error` — the app promotion has
      # already succeeded or auto-rolled-back by this point, and that outcome
      # must never depend on the monitoring box-side stack. monitoring/*.yml
      # and docker-compose.monitoring.yml live in THIS repo, but the app
      # deploy above never checks out the repo on the box (it only pulls the
      # prebuilt image) — so without this step, config changes to the
      # monitoring stack would only ever reach production by someone
      # remembering to SSH in and re-run deploy_monitoring.sh by hand (see
      # deploy/aws/README.md). This closes that gap: bring the box's own
      # persistent checkout (used only by this script, not the app deploy)
      # to the exact tag just promoted, then re-run the idempotent script.
      - name: Sync + redeploy monitoring stack (non-blocking)
        id: monitoring_deploy
        if: always() && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          GIT_REF: ${{ github.ref_name }}
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          set -euo pipefail

          cat > /tmp/remote-monitoring.sh <<'REMOTE_EOF'
          set -uo pipefail
          REF="__GIT_REF__"
          log(){ echo "[monitoring-sync] $*"; }

          # The box's persistent checkout is the ONE thing in this pipeline
          # named after the repository, so it is the one thing a repo RENAME
          # can break. This repo was renamed multimodal-rag-assistant ->
          # MULTIMODAL-AGENTIC-RAG-INTEGRATED-KNOWLEDGE-AI-ASSISTANT; the
          # production and staging boxes predate that (staging is an AMI clone
          # of production, so it inherited whatever directory name prod had).
          # Probe both instead of hardcoding one: a stale directory name would
          # otherwise make this step fail on every promote — and because the
          # step is continue-on-error, it would fail SILENTLY, leaving
          # monitoring config frozen at whatever tag was last synced while the
          # app itself kept deploying fine. Nothing else here is name-derived:
          # the app deploy only pulls the prebuilt image, whose ref is computed
          # from GITHUB_REPOSITORY at runtime and is therefore always current.
          REPO_DIR=""
          for d in "/home/ubuntu/MULTIMODAL-AGENTIC-RAG-INTEGRATED-KNOWLEDGE-AI-ASSISTANT" \
                   "/home/ubuntu/multimodal-rag-assistant"; do
            if [ -d "${d}/.git" ]; then REPO_DIR="$d"; break; fi
          done
          [ -n "${REPO_DIR}" ] \
            || { log "FATAL: no git checkout found at /home/ubuntu/MULTIMODAL-AGENTIC-RAG-INTEGRATED-KNOWLEDGE-AI-ASSISTANT or /home/ubuntu/multimodal-rag-assistant — see deploy/aws/README.md 'Monitoring-stack secrets in SSM'"; exit 1; }
          log "using checkout ${REPO_DIR}"
          cd "${REPO_DIR}"

          # A renamed repo keeps working over GitHub's redirect, but pin the
          # remote to the current URL anyway so the redirect is not a
          # permanent dependency.
          git remote set-url origin \
            "https://github.com/vjkarthik98/MULTIMODAL-AGENTIC-RAG-INTEGRATED-KNOWLEDGE-AI-ASSISTANT.git" \
            >/dev/null 2>&1 || true

          # Bring the box's checkout to the SAME tag that was just promoted —
          # not just `git pull` on a branch — so monitoring config on the box
          # always matches what's actually running, never a moving branch tip.
          git fetch --tags origin >/dev/null 2>&1 \
            || { log "FATAL: git fetch failed"; exit 1; }
          git checkout -q "${REF}" \
            || { log "FATAL: git checkout ${REF} failed"; exit 1; }
          git reset -q --hard "${REF}" \
            || { log "FATAL: git reset --hard ${REF} failed"; exit 1; }
          log "checkout now at $(git rev-parse --short HEAD) (${REF})"

          bash deploy/aws/scripts/deploy_monitoring.sh
          REMOTE_EOF

          sed -i "s|__GIT_REF__|${GIT_REF}|g" /tmp/remote-monitoring.sh
          SCRIPT_B64="$(base64 -w0 /tmp/remote-monitoring.sh)"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "magik monitoring sync ${GIT_REF}" \
            --timeout-seconds 300 \
            --parameters "{\"commands\":[\"echo $SCRIPT_B64 | base64 -d > /tmp/mm.sh\",\"bash /tmp/mm.sh\"],\"executionTimeout\":[\"600\"]}" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          # Shorter cap than the app deploy's 40 min — this only pulls small
          # config images and restarts containers already on the box, no
          # multi-GB model pull or cold GPU load to wait through.
          DEADLINE=$(( SECONDS + 600 ))
          STATUS="Pending"
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            echo "  ... $STATUS ($SECONDS s elapsed)"
            sleep 15
          done

          echo "=== remote stdout ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text 2>/dev/null || true
          echo "=== remote stderr ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text 2>/dev/null || true

          [ "$STATUS" = "Success" ] || { echo "::error::monitoring-stack sync finished with status: $STATUS"; exit 1; }

      - name: Post deploy summary
        if: always()
        run: |
          echo "## Promote to production — ${{ needs.build-push.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validated on staging by tier2-staging-gate before this ran." >> "$GITHUB_STEP_SUMMARY"
          echo "- Instance: ${{ steps.instance.outputs.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Monitoring stack sync: ${{ steps.monitoring_deploy.outcome || 'skipped (app deploy did not succeed)' }}" >> "$GITHUB_STEP_SUMMARY"

      # A failed deploy here may already have auto-rolled-back on the box
      # (see the SSM script's own rollback branch) — either way this is the
      # signal that something needs a human look, and unlike a PR's Tier-1
      # gate, nobody is watching this run live when it's triggered by a tag
      # push. No-op until SLACK_WEBHOOK_URL is set — see docs/runbooks/ci-cd.md.
      - name: Notify on failure (Slack, optional)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"text\": \"MAGIK production promotion of ${{ needs.build-push.outputs.image_tag }} FAILED — may have auto-rolled-back to the previous image. Staging had already passed Tier-2. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

      # Separate from the app-deploy failure notification above: this is the
      # monitoring stack specifically. The app promotion already succeeded
      # (this step only runs `if: steps.deploy.outcome == 'success'`), so a
      # failure here is a "go check Grafana/Prometheus on the box" ticket,
      # never a "production app is down" incident — worded accordingly so
      # on-call doesn't confuse the two at 2am.
      - name: Notify on monitoring-sync failure (Slack, optional)
        if: steps.monitoring_deploy.outcome == 'failure' && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"text\": \"MAGIK monitoring-stack sync FAILED after promoting ${{ needs.build-push.outputs.image_tag }} — the app itself deployed fine, but Grafana/Prometheus/Loki/Tempo on the box may now be stale or down. Not a production-app incident. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

  # ---------------------------------------------------------------------
  # Ragas + DeepEval post-release quality report — genuinely portfolio-facing,
  # never a gate: runs once per real release (production is already awake and
  # healthy from promote-production, so this costs no extra wake), never
  # blocks or rolls back the deploy it follows.
  #
  # Runs on a bare runner, outside the server's own container/secret
  # boundary — app/eval/http_client.py's EvalAuth cannot mint a token
  # in-process there (it would sign with the wrong JWT_SECRET_KEY and get
  # silently rejected forever, see that module's docstring for the incident
  # that found this), so it logs in as a dedicated eval-reporter account
  # instead (app/bin/seed_eval_reporter.py, run once against production's
  # real Mongo — see that script's own output for the exact secrets to set).
  # Until EVAL_REPORTER_EMAIL/PASSWORD are configured, both eval calls below
  # fail cleanly (real 401s, an honest error in the report) rather than
  # silently faking a result — continue-on-error covers exactly that gap.
  # ---------------------------------------------------------------------
  report-quality-metrics:
    needs: [build-push, promote-production]
    if: needs.promote-production.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eval + report dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[quality]"

      - name: RAGAS report (post-release, live)
        id: ragas
        continue-on-error: true
        env:
          EVAL_SERVER_URL: "https://magik.vk-ai.online"
          EVAL_USER_ID: "5ead49e7-42f0-4368-80ac-8014595c3980"
          EVAL_REPORTER_EMAIL: ${{ secrets.EVAL_REPORTER_EMAIL }}
          EVAL_REPORTER_PASSWORD: ${{ secrets.EVAL_REPORTER_PASSWORD }}
        run: python -m app.eval.ragas_report

      - name: DeepEval report (post-release, live)
        id: deepeval
        continue-on-error: true
        env:
          EVAL_SERVER_URL: "https://magik.vk-ai.online"
          EVAL_USER_ID: "5ead49e7-42f0-4368-80ac-8014595c3980"
          EVAL_REPORTER_EMAIL: ${{ secrets.EVAL_REPORTER_EMAIL }}
          EVAL_REPORTER_PASSWORD: ${{ secrets.EVAL_REPORTER_PASSWORD }}
        run: python -m app.eval.deepeval_suite --limit 10

      - name: Regenerate quality badges
        run: python scripts/generate_quality_badges.py

      - name: Commit report + badges (only if something actually changed)
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.name "magik-bot"
          git config user.email "actions@users.noreply.github.com"
          git add quality-reports/ragas quality-reports/deepeval quality-badges
          if git diff --cached --quiet; then
            echo "No new report content — nothing to commit."
          else
            git commit -m "chore: post-release quality report ${IMAGE_TAG} [skip ci]"
            git push origin main
          fi

      - name: Post summary
        if: always()
        run: |
          echo "## Post-release quality report — ${{ needs.build-push.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ragas: ${{ steps.ragas.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- DeepEval: ${{ steps.deepeval.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Non-blocking — never affects the release itself." >> "$GITHUB_STEP_SUMMARY"
