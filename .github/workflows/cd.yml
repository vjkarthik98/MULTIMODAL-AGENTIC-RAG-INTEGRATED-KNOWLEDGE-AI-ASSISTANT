name: CD

# Tag-triggered: build the production image, push to GHCR, wake/deploy to the
# real EC2 GPU box, smoke test, roll back automatically on failure, then
# dispatch the Tier-2 full eval suite (see eval-gate.yml).
#
# PREREQUISITES NOT YET PROVISIONED (documented here, not silently assumed —
# see docs/runbooks/ci-cd.md "Phase 30 handoff"). This workflow is correct
# but CANNOT succeed end-to-end until these exist:
#   1. The EC2 instance itself (user has AWS quota, hasn't launched it yet).
#   2. An IAM role for GitHub OIDC (`vars.AWS_DEPLOY_ROLE_ARN`) with least-
#      privilege ec2:StartInstances/DescribeInstances + ssm:SendCommand
#      scoped to that one instance — no long-lived AWS keys in GH secrets.
#   3. The instance tagged `Name=${{ vars.EC2_INSTANCE_TAG }}` (default
#      "magik-prod") so this workflow can look it up without a hardcoded ID.
#   4. SSM Agent running on the box (default on AWS Deep Learning AMI /
#      standard Ubuntu AMI + amazon-ssm-agent package) and an instance
#      profile granting it ssm:UpdateInstanceInformation etc.
#   5. A GHCR read PAT stored in SSM Parameter Store
#      (`/magik/ghcr_pat`) so the box can `docker pull` without the token
#      ever touching a GH Actions log.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write   # OIDC — no static AWS credentials

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Job-level override — must restate what the workflow-level block grants,
    # since a job-level `permissions:` replaces it wholesale rather than
    # merging. `security-events: write` is the addition: it's what lets
    # github/codeql-action/upload-sarif publish Trivy findings to the repo's
    # Security tab.
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # A hosted runner ships ~14GB free, but this is an nvidia/cuda image with
      # the full ML stack. On CD run #6 that was enough to BUILD and PUSH, then
      # Syft and Trivy both died with "no space left on device" trying to export
      # the image locally to scan it. Reclaiming the preinstalled toolchains we
      # never use frees ~25-30GB and costs about 30 seconds.
      - name: Free disk space on runner
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get clean || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "after:";  df -h / | tail -1

      - id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compiling the CUDA wheel is a build-time step (nvcc cross-compiles
      # for sm_89, L40S/g6e.xlarge) — does not need a physical GPU, works
      # fine on this hosted runner. See Dockerfile's `cuda-builder` stage.
      #
      # sbom/provenance: buildkit attaches an SPDX SBOM and a SLSA provenance
      # attestation to the pushed image itself, so "what is actually inside
      # the artifact running in prod" is answerable from the registry alone
      # (`docker buildx imagetools inspect`), not reconstructed from the
      # Dockerfile. The standalone Syft step below additionally emits a
      # downloadable SBOM artifact for anyone without registry access.
      - uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_TAG=${{ steps.meta.outputs.tag }}
          # Explicit shared scope. The default gha cache scope is derived from
          # the git ref, so a TAG build cannot read a cache written by a
          # different tag or by a branch build — which is why v0.26.1 recompiled
          # llama-cpp-python from source for 1h21m despite v0.26.0 having built
          # the identical layer minutes earlier. A fixed scope pools them.
          cache-from: type=gha,scope=magik-cuda-runtime
          cache-to: type=gha,mode=max,scope=magik-cuda-runtime
          sbom: true
          provenance: mode=max

      # ── Supply-chain: SBOM artifact ──────────────────────────────────────
      # NON-BLOCKING, same treatment as the Trivy scan below: an SBOM is a
      # supply-chain/compliance artifact, not a release gate. Confirmed by a
      # real failure (2026-07-28): Syft errored scanning the freshly-pushed
      # image (exit code 1, cause not yet root-caused) and, lacking
      # continue-on-error, took down the ENTIRE job — deploy never ran even
      # though docker/build-push-action above had already succeeded and the
      # image was genuinely in GHCR. An SBOM generation hiccup must never
      # block shipping a working, already-built image.
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false   # uploaded explicitly below, with a stable name

      - name: Upload SBOM
        # Skip cleanly (grey) rather than fail-but-ignore (orange) when Syft
        # produced no file — keeps a green run genuinely green.
        if: hashFiles('sbom.spdx.json') != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sbom-${{ steps.meta.outputs.tag }}
          path: sbom.spdx.json
          retention-days: 90

      # ── Supply-chain: image vulnerability scan ───────────────────────────
      # NON-BLOCKING, and unlike security.yml's Bandit gate this one is
      # explicitly NOT calibrated against a measured baseline — the image has
      # never been built (no Docker on the dev machine; a CUDA image is far
      # too large/slow to build there just to count CVEs). Claiming a
      # threshold here would be guessing.
      #
      # Expect the first real run to report a substantial count: the base is
      # an nvidia/cuda image, and CUDA/Ubuntu bases habitually carry many
      # OS-level CVEs that have no upstream fix available. `ignore-unfixed:
      # true` already filters to *actionable* findings only (a CVE with a
      # patched version published), which is the number worth reacting to.
      #
      # TO CALIBRATE (do this on the first tagged build, alongside the AWS
      # bring-up): read the SARIF in the Security tab, confirm the CRITICAL
      # findings are genuinely unfixable base-image noise rather than
      # something we introduced, then set `exit-code: 1` with
      # `severity: CRITICAL` to make it a real gate.
      # Pinned to a v-prefixed tag: aquasecurity retired all non-"v" tags
      # (e.g. the old "0.24.0") following a supply-chain incident, and now
      # publishes only "vX.Y.Z" releases — an unprefixed tag no longer resolves.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # informational until calibrated — see note above

      # Public repo, so GitHub code scanning is free — findings land in the
      # repo's Security tab with per-CVE history instead of being buried in
      # a job log nobody re-reads.
      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Resolve instance ID by tag
        id: instance
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ vars.EC2_INSTANCE_TAG || 'magik-prod' }}" \
                      "Name=instance-state-name,Values=stopped,running,stopping" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "::error::No instance tagged Name=${{ vars.EC2_INSTANCE_TAG || 'magik-prod' }} found. See docs/runbooks/ci-cd.md prerequisites."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      # ADR-5 (Phase 30 scale-to-zero): the box is stopped-by-default for
      # cost reasons — this must not assume it's already running.
      # start-instances on an already-running instance is a harmless no-op.
      - name: Wake instance (idempotent)
        run: aws ec2 start-instances --instance-ids ${{ steps.instance.outputs.id }} || true

      - name: Wait until running + SSM-reachable
        run: |
          aws ec2 wait instance-running --instance-ids ${{ steps.instance.outputs.id }}
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.instance.outputs.id }}" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "None")
            [ "$STATUS" = "Online" ] && break
            sleep 10
          done
          [ "$STATUS" = "Online" ] || { echo "::error::SSM agent not reachable after 5 min"; exit 1; }

      # Keeps the previous container renamed (not removed) so failure can
      # roll back instantly instead of re-pulling an old image.
      #
      # The remote script is authored as a normal shell script here, then
      # base64-encoded into ONE SSM command. The previous inline JSON-array
      # form required hand-escaping quotes and `$` through two layers (YAML →
      # JSON → shell), which is a standing source of silent breakage; this
      # form has exactly one quoting boundary.
      - name: Deploy via SSM (pull, swap, health check, auto-rollback)
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.build-push.outputs.image_tag }}
          GH_OWNER: ${{ github.repository_owner }}
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          set -euo pipefail

          cat > /tmp/remote-deploy.sh <<'REMOTE_EOF'
          set -uo pipefail
          IMG="__IMAGE_REF__"
          OWNER="__GH_OWNER__"
          log(){ echo "[deploy] $*"; }

          # ── Preflight: fail fast and legibly, BEFORE the multi-GB pull ─────
          command -v docker >/dev/null 2>&1 || { log "FATAL: docker not installed"; exit 1; }
          command -v aws    >/dev/null 2>&1 || { log "FATAL: aws cli not installed"; exit 1; }
          docker info >/dev/null 2>&1       || { log "FATAL: docker daemon unreachable"; exit 1; }
          for p in /opt/magik/.env /opt/magik/.hf_cache /opt/magik/data /opt/magik/logs; do
            [ -e "$p" ] || { log "FATAL: missing required path $p"; exit 1; }
          done
          if ! docker run --rm --gpus all nvidia/cuda:12.8.0-base-ubuntu22.04 nvidia-smi >/dev/null 2>&1; then
            log "FATAL: '--gpus all' not functional — nvidia-container-toolkit missing/broken"
            exit 1
          fi
          log "preflight OK"

          # ── Reclaim disk BEFORE pulling ~20GB ─────────────────────────────
          # Every release leaves another multi-GB CUDA image behind and nothing
          # ever collected them. On the v0.27.0 deploy the root volume filled
          # and `docker pull` died mid-write with "no space left on device"
          # after the build had already spent an hour — the single most
          # expensive way to discover a full disk.
          #
          # Staged, least-destructive-first: dangling layers and build cache go
          # unconditionally (nothing can want them), and the rollback image is
          # only sacrificed if that was not enough. Losing instant rollback is
          # strictly better than a deploy that cannot start.
          disk_free_gb(){ df -BG --output=avail / | tail -1 | tr -dc '0-9'; }
          log "disk free before cleanup: $(disk_free_gb)GB"

          docker image prune -f >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          log "disk free after safe prune: $(disk_free_gb)GB"

          if [ "$(disk_free_gb)" -lt 40 ]; then
            log "under 40GB — dropping the rollback container to reclaim its image"
            docker rm -f magik-previous >/dev/null 2>&1 || true
            # -a removes every image no RUNNING container references. The image
            # behind magik-current is therefore retained.
            docker image prune -af >/dev/null 2>&1 || true
            log "disk free after full prune: $(disk_free_gb)GB"
          fi

          # Fail fast and legibly rather than 8 minutes into a doomed pull.
          FREE_GB="$(disk_free_gb)"
          if [ "${FREE_GB:-0}" -lt 30 ]; then
            log "FATAL: only ${FREE_GB}GB free on / after cleanup; this image needs ~25GB to unpack."
            log "Grow the EBS volume (growpart + resize2fs) or clear /opt/magik. Largest consumers:"
            df -h / || true
            du -sh /opt/magik/* 2>/dev/null | sort -rh | head -10 || true
            docker system df || true
            exit 1
          fi
          log "disk OK — ${FREE_GB}GB free"

          # ── Pull BEFORE touching the running container, so a failed pull
          #    never takes down a working service ───────────────────────────
          GHCR_PAT="$(aws ssm get-parameter --name /magik/ghcr_pat \
                        --with-decryption --query Parameter.Value --output text)" \
            || { log "FATAL: could not read /magik/ghcr_pat from SSM"; exit 1; }
          echo "$GHCR_PAT" | docker login ghcr.io -u "$OWNER" --password-stdin \
            || { log "FATAL: docker login to ghcr.io failed"; exit 1; }
          log "pulling $IMG (multi-GB, several minutes expected)"
          docker pull "$IMG" || { log "FATAL: docker pull failed"; exit 1; }

          # ── Local cache sidecar ───────────────────────────────────────────
          # app/core/infra_registry.py::get_cache() backs ingestion job status,
          # the JWT blacklist, the embedding cache and per-user rate limits. It
          # dials settings.LOCAL_CACHE_HOST, which defaults to "localhost" —
          # and inside a container "localhost" is the CONTAINER, not the host.
          # Without a reachable Redis, get_cache() returns None and every caller
          # degrades: job-status polls 404 (breaking UI upload progress) and
          # app/auth/rate_limit.py FAILS OPEN, which on a public demo removes
          # the only guard against someone hammering a $1.86/hr GPU.
          #
          # A sidecar on a user-defined network fixes it without touching
          # /opt/magik/.env — the -e below overrides the env-file, so running
          # from source on the host (where localhost IS correct) still works.
          docker network create magik-net >/dev/null 2>&1 || true
          if ! docker ps --filter name=magik-redis --filter status=running -q | grep -q .; then
            docker rm -f magik-redis >/dev/null 2>&1 || true
            # Ephemeral by design: no persistence, bounded memory, LRU eviction.
            docker run -d --name magik-redis \
              --network magik-net --restart unless-stopped \
              --log-opt max-size=10m --log-opt max-file=2 \
              redis:7-alpine redis-server \
                --save "" --appendonly no \
                --maxmemory 512mb --maxmemory-policy allkeys-lru \
              || { log "FATAL: could not start magik-redis sidecar"; exit 1; }
            log "started magik-redis sidecar"
          else
            docker network connect magik-net magik-redis >/dev/null 2>&1 || true
            log "magik-redis already running"
          fi

          # ── Swap ──────────────────────────────────────────────────────────
          docker rm -f magik-previous >/dev/null 2>&1 || true
          # STOP before rename. `docker rename` does NOT stop a container — it
          # keeps running and keeps its port binding, so the `docker run` below
          # then dies with "Bind for 0.0.0.0:8000 failed: port is already
          # allocated". This is invisible on a first deploy (no magik-current
          # exists, rename is a no-op) and breaks every deploy after it, which
          # is exactly how it reached production: run #8 was green, v0.27.0
          # failed here. Stopped — not removed — so the rollback path below can
          # still bring it back with `docker start`.
          docker stop -t 30 magik-current >/dev/null 2>&1 || true
          docker rename magik-current magik-previous >/dev/null 2>&1 || true

          # --shm-size: torch dataloaders/multiprocessing outgrow the 64MB default.
          # --log-opt:  cap container logs; this box has already hit a full disk once.
          docker run -d --name magik-current \
            --gpus all --restart unless-stopped \
            --network magik-net \
            --shm-size=2g \
            --log-opt max-size=50m --log-opt max-file=3 \
            -p 8000:8000 \
            --env-file /opt/magik/.env \
            -e LOCAL_CACHE_HOST=magik-redis \
            -e TORCH_HOME=/app/.hf_cache/torch \
            -v /opt/magik/.hf_cache:/app/.hf_cache \
            -v /opt/magik/data:/app/data \
            -v /opt/magik/logs:/app/logs \
            "$IMG"
          if [ $? -ne 0 ]; then
            log "FATAL: docker run failed (port 8000 already held by a non-container process?)"
            docker rename magik-previous magik-current >/dev/null 2>&1 || true
            docker start magik-current >/dev/null 2>&1 || true
            exit 1
          fi

          # ── Health check ──────────────────────────────────────────────────
          # 80 x 15s = 20 min. A cold start pages ~18GB of models off EBS
          # (measured ~139 MB/s on this box) and warms llama-server on the GPU;
          # the previous 5-minute window could not cover that.
          log "waiting for /health (up to 20 min for cold model load)"
          for i in $(seq 1 80); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              log "HEALTHY after $(( i * 15 ))s"
              docker ps --filter name=magik-current --format '{{.Names}} {{.Status}}'
              exit 0
            fi
            if ! docker ps -q --filter name=magik-current --filter status=running | grep -q .; then
              log "FATAL: container exited during startup — last 80 log lines:"
              docker logs --tail 80 magik-current 2>&1 || true
              break
            fi
            sleep 15
          done

          log "DEPLOY_HEALTHCHECK_FAILED — last 80 log lines:"
          docker logs --tail 80 magik-current 2>&1 || true
          docker rm -f magik-current >/dev/null 2>&1 || true
          docker rename magik-previous magik-current >/dev/null 2>&1 || true
          docker start magik-current >/dev/null 2>&1 || true
          exit 1
          REMOTE_EOF

          sed -i "s|__IMAGE_REF__|${IMAGE_REF}|g; s|__GH_OWNER__|${GH_OWNER}|g" /tmp/remote-deploy.sh
          SCRIPT_B64="$(base64 -w0 /tmp/remote-deploy.sh)"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "magik deploy ${{ needs.build-push.outputs.image_tag }}" \
            --timeout-seconds 600 \
            --parameters "{\"commands\":[\"echo $SCRIPT_B64 | base64 -d > /tmp/md.sh\",\"bash /tmp/md.sh\"],\"executionTimeout\":[\"3600\"]}" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          # Poll manually: the built-in `aws ssm wait command-executed` waiter
          # is fixed at 20 attempts x 5s = 100s, which cannot cover a multi-GB
          # pull plus cold model load. 40-minute cap here instead.
          DEADLINE=$(( SECONDS + 2400 ))
          STATUS="Pending"
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            echo "  ... $STATUS ($SECONDS s elapsed)"
            sleep 15
          done

          echo "=== remote stdout ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text 2>/dev/null || true
          echo "=== remote stderr ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text 2>/dev/null || true

          [ "$STATUS" = "Success" ] || { echo "::error::SSM deploy finished with status: $STATUS"; exit 1; }

      - name: Post deploy summary
        if: always()
        run: |
          echo "## Deploy — ${{ needs.build-push.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instance: ${{ steps.instance.outputs.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

      # A failed deploy here may already have auto-rolled-back on the box
      # (see the SSM script's own rollback branch) — either way this is the
      # signal that something needs a human look, and unlike a PR's Tier-1
      # gate, nobody is watching this run live when it's triggered by a tag
      # push. No-op until SLACK_WEBHOOK_URL is set — see docs/runbooks/ci-cd.md.
      - name: Notify on failure (Slack, optional)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"text\": \"MAGIK deploy of ${{ needs.build-push.outputs.image_tag }} FAILED — may have auto-rolled-back to the previous image. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

  post-deploy-eval:
    needs: deploy
    runs-on: ubuntu-latest
    # Job-level override: the workflow-level default above is `contents:
    # read`. repository_dispatch's underlying REST call (POST /repos/{owner}/
    # {repo}/dispatches) needs `contents: write` on the token even for a
    # same-repo dispatch (confirmed against GitHub's own docs/community
    # guidance, 2026-07-25 — see docs/runbooks/ci-cd.md) — without this the
    # dispatch call 403s and Tier-2 silently never fires. GITHUB_TOKEN itself
    # is fine here (no PAT needed): the "GITHUB_TOKEN can't trigger other
    # workflows" restriction has an explicit exception for repository_dispatch
    # and workflow_dispatch, and a same-repo dispatch doesn't need the
    # cross-repo `repo`-scoped PAT that a remote-repo dispatch would.
    permissions:
      contents: write
    # Tier-2 runs on `[self-hosted, gpu]`. Until that runner is registered on
    # the box (Phase 30 Stage 5), dispatching only produces a run that sits
    # QUEUED forever waiting for a runner that will never appear — noise, not
    # signal. Set repo variable SELF_HOSTED_GPU_RUNNER=true once `gh runner
    # list` shows an online `gpu` runner; until then this job skips cleanly
    # (grey, not red) instead of queueing a phantom eval.
    if: vars.SELF_HOSTED_GPU_RUNNER == 'true'
    steps:
      - name: Dispatch Tier-2 full eval suite
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: post-deploy-eval
