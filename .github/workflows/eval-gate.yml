name: Eval Gate

# Two-tier RAG-quality gate (see docs/runbooks/ci-cd.md for the full design
# rationale):
#
#   tier1-retrieval  — BM25 + Qdrant + BGE embedder, NO LLM generation.
#                       ~3GB RAM. Runs on every PR, on a standard hosted
#                       runner, and blocks merge on regression.
#
#   tier2-full-suite — full generation + Qwen2.5-7B judge suite.
#                       Needs the full resident model stack (~17.7GB+ per
#                       CLAUDE.md's model catalog) AND a live running API
#                       (app/eval/run.py routes generation calls through
#                       HTTP to /rag/query, not in-process). This does not
#                       fit on any hosted CI runner or a 16GB laptop —
#                       it runs ONLY on the self-hosted runner registered on
#                       the real AWS GPU box, triggered by schedule /
#                       workflow_dispatch / repository_dispatch — deliberately
#                       NEVER by `pull_request`, since this is a public repo
#                       and a fork PR must never be able to execute on a
#                       self-hosted runner.
#
#   seed-eval-fixtures — one-off/maintainer job. The gold QA set
#                       (app/eval/datasets/gold/*.jsonl) is versioned in git,
#                       but the underlying ingested corpus (Qdrant vectors +
#                       local BM25 .pkl indexes under data/, per
#                       app/bm25/base_bm25.py) is NOT — data/ is gitignored
#                       and BM25 indexes are local files, not cloud state.
#                       This job (self-hosted only, manual) re-ingests
#                       data/raw/finance into the real Qdrant Cloud collection
#                       + local BM25 index, then publishes the BM25 index as
#                       a GitHub Actions cache that tier1-retrieval restores.
#                       Must be re-run whenever the gold set / corpus changes
#                       (cache key is keyed on the gold-set file hashes).

on:
  # No paths-ignore on pull_request — same reasoning as ci.yml (see the note
  # there): a filtered-out workflow reports NO status, so a required check
  # would hang a doc-only PR on "waiting for status" forever. Public repo =
  # unlimited free minutes, so the skip bought nothing. workflow_dispatch/
  # schedule/repository_dispatch aren't file-change triggers, so path
  # filtering never applied to them either way.
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: "Run seed-eval-fixtures instead of tier2 (re-ingest eval corpus, refresh BM25 cache)"
        type: boolean
        default: false
  # NIGHTLY TIER-2 — DISABLED until a self-hosted GPU runner is registered.
  #
  # tier2-full-suite is `runs-on: [self-hosted, gpu]`. With no such runner
  # registered, a scheduled run does not fail fast — it sits QUEUED waiting
  # for a matching runner that will never appear (observed: run 30190058393
  # queued 3h+ and counting). That produces a permanently-yellow workflow and
  # daily noise that means nothing.
  #
  # Re-enable by uncommenting, as part of the Phase 30 AWS bring-up, once
  # `gh runner list` shows a runner with the `gpu` label online.
  # schedule:
  #   - cron: "0 3 * * *"   # nightly tier2 run
  repository_dispatch:
    types: [post-deploy-eval]   # triggered by cd.yml after a successful deploy

concurrency:
  group: eval-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a gate mid-run

permissions:
  contents: read

env:
  EVAL_USER_ID: ${{ vars.EVAL_USER_ID || 'eval_default' }}

jobs:
  # ---------------------------------------------------------------------
  # TIER 1 — blocks every PR. Hosted runner, no GPU, no live server needed
  # (retrieval_runner.py calls HybridRetriever in-process).
  # ---------------------------------------------------------------------
  tier1-retrieval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      DATA_DIR: ${{ github.workspace }}/data
      # Same reasoning as ci.yml's lint-type-test job: this is an in-process
      # retrieval-only eval (HybridRetriever called directly, no HTTP, no
      # auth flow), so AUTH_ENABLED=false avoids requiring a real
      # JWT_SECRET_KEY just to satisfy Settings.validate() at import time.
      ENV: test
      AUTH_ENABLED: "false"
      # Settings.validate() also rejects the "CHANGE_ME_IN_PRODUCTION"
      # default for SECRET_KEY/JWT_SECRET_KEY whenever ENV != "development",
      # independent of AUTH_ENABLED above. Placeholder values only, never
      # used to sign anything real.
      SECRET_KEY: "ci-test-only-placeholder-secret-not-a-real-credential"
      JWT_SECRET_KEY: "ci-test-only-placeholder-jwt-secret-not-a-real-credential"
    steps:
      - uses: actions/checkout@v4

      # Fail in 5 seconds with the actual reason, instead of ~20 minutes of
      # installing torch and then scoring an empty index as "recall regressed".
      # That is exactly how this gate first failed for real (run 30185188038):
      # no QDRANT_* secrets were configured, so retrieval had no data source at
      # all, and the resulting red check read as a quality regression rather
      # than "the gate is unconfigured". A gate that can't distinguish "broken"
      # from "regressed" trains people to ignore it.
      - name: Preflight — required eval configuration
        env:
          TRIGGERING_ACTOR: ${{ github.actor }}
        run: |
          missing=""
          [ -z "${QDRANT_URL}" ] && missing="${missing} QDRANT_URL"
          [ -z "${QDRANT_API_KEY}" ] && missing="${missing} QDRANT_API_KEY"
          if [ -n "${missing}" ]; then
            if [ "${TRIGGERING_ACTOR}" = "dependabot[bot]" ]; then
              # Dependabot-triggered runs are DENIED repository Actions secrets
              # by design (GitHub security model) — they read from a separate
              # "Dependabot secrets" store instead. Every early failure of this
              # gate was exactly this: the runs were all on dependabot/* branches,
              # and the generic "add your secrets" message would have sent you to
              # the wrong settings page. The same values must be added TWICE,
              # under both stores, with identical names.
              echo "::error title=Eval gate: missing Dependabot secrets::Missing:${missing}. This run was triggered by Dependabot, which cannot read repository Actions secrets. Add the SAME values under Settings -> Secrets and variables -> Dependabot (not Actions). See docs/runbooks/ci-cd.md."
            else
              echo "::error title=Eval gate not configured::Missing:${missing}. Tier-1 scores retrieval against the real Qdrant collection; without these it has no corpus and would report a false regression. Add them under Settings -> Secrets and variables -> Actions. See docs/runbooks/ci-cd.md."
            fi
            exit 1
          fi
          if [ "${EVAL_USER_ID}" = "eval_default" ]; then
            echo "::warning title=EVAL_USER_ID is the fallback::Using 'eval_default'. If your ingested eval corpus lives under a different user_id, set the EVAL_USER_ID repository variable or this gate will score an empty tenant."
          fi

      # NO `cache: pip` — see the long note in ci.yml's lint-type-test job.
      # Short version: caching pip here stores ~4.8GB of torch/CUDA wheels and
      # crowds cd.yml's Docker buildx cache out of the 10GB per-repo limit,
      # turning every release build into a ~1h llama-cpp-python recompile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinning the CPU torchcodec wheel (below) fixed the libnvrtc.so.13/CUDA
      # crash, but exposed the next layer: torchcodec's wheel has no bundled
      # FFmpeg — it dynamically loads libavutil.so/libavcodec.so etc. from
      # the system at import time. This hosted runner's preinstalled ffmpeg
      # is a static tool-cache binary with no matching shared libraries, so
      # every one of torchcodec's supported FFmpeg versions (4-8) failed to
      # dlopen — confirmed live (2026-08-01, run 30681177552): "OSError:
      # libavutil.so.60/59/58/57/56: cannot open shared object file", which
      # again crashed the same pure-text BGE embedder load and failed
      # retriever_init as a gate breach. apt's ffmpeg package (unlike the
      # tool-cache one) ships real libavutil/libavcodec/libswscale .so files.
      - name: Install ffmpeg (shared libs for torchcodec)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same reasoning as ci.yml's lint-type-test job: this hosted runner
          # has no GPU/driver, and a bare `pip install -r requirements.txt`
          # resolves torch>=2.6 as a CUDA build from PyPI's default index —
          # pin the CPU wheel explicitly first per requirements.txt's own
          # header, since HybridRetriever here loads the BGE embedder
          # in-process (torch import at collection/call time either way).
          #
          # torchcodec included here too — it's torchaudio's own transitive
          # dependency (modern torchaudio delegates torchaudio.load() to it),
          # not declared directly in requirements.txt, so without pinning it
          # to this same CPU index pip resolved it from PyPI's default index
          # instead and got a build whose .so files hard-require
          # libnvrtc.so.13 (CUDA runtime) just to *import*, even though
          # nothing here ever touches audio decoding — confirmed live
          # (2026-07-31): a plain text_embedder (BGE) load crashed
          # retriever_init entirely, failing the whole Tier-1 gate, because
          # something in the transformers/sentence-transformers import chain
          # eagerly probes torchaudio (which eagerly probes torchcodec) even
          # when loading a pure-text model that never needs either.
          pip install torch torchvision torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # BM25 index for EVAL_USER_ID is gitignored local state (data/), not
      # reproducible from a bare checkout. Try the cache first (fast path).
      #
      # NOTE THE `-v2-` SALT. It is load-bearing, not cosmetic. The first run
      # of this job saved an index pickled while
      # app/retrieval/bm25_retriever.py was executing as `__main__`, so every
      # BM25Document recorded its class as `__main__.BM25Document` and no
      # other process could unpickle it. Fixing the source was not enough:
      # the poisoned artifact was already in the cache, the cache then HIT on
      # every later run, the rebuild step was skipped by its own
      # `cache-hit != 'true'` guard, and the fix never executed. Cache keys are
      # immutable, so the only way to publish a corrected artifact is a new
      # key. Bump this salt whenever the pickled schema or the code that
      # produces it changes incompatibly.
      # `restore-keys` is salted too — a bare `bm25-eval-index-` prefix would
      # happily fall back to the very poisoned entry we are escaping.
      - name: Restore eval BM25 index
        id: bm25_cache
        uses: actions/cache/restore@v4
        with:
          path: data/users/${{ env.EVAL_USER_ID }}/bm25_index
          key: bm25-eval-index-v2-${{ hashFiles('app/eval/datasets/gold/**') }}
          restore-keys: |
            bm25-eval-index-v2-

      # A cache HIT is not proof of a USABLE index — that assumption is
      # exactly what let a corrupt artifact silently degrade the gate to
      # dense-only for two full runs while reporting it as a retrieval
      # regression. Actually open it and check it loads with documents.
      # Cheap (no models, no network) and turns a whole class of
      # stale/corrupt-cache failures into an automatic rebuild.
      - name: Validate restored BM25 index
        id: bm25_check
        if: steps.bm25_cache.outputs.cache-hit == 'true'
        run: |
          set +e
          python - <<'PY'
          import sys
          from app.retrieval.bm25_retriever import BM25Retriever
          import os
          uid = os.environ["EVAL_USER_ID"]
          try:
              r = BM25Retriever(user_id=uid)
              r._load_index(uid)
              n = len(r.documents)
          except Exception as exc:
              print(f"restored index unusable: {exc}")
              sys.exit(1)
          if n == 0:
              print("restored index loaded but contains 0 documents")
              sys.exit(1)
          print(f"restored index OK: {n} documents")
          PY
          if [ $? -eq 0 ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=BM25 cache unusable::Restored cache failed to load; rebuilding from Qdrant."
          fi

      # Self-heal on a cache miss instead of scoring an empty index.
      #
      # The original design expected `seed-eval-fixtures` to publish this
      # cache — but that job is `runs-on: [self-hosted, gpu]` and
      # workflow_dispatch-only, so on a repo with no self-hosted runner
      # registered the cache could NEVER be populated, and every PR's Tier-1
      # run scored recall against an empty BM25 index and failed. That is
      # precisely what happened on every PR until now (see run 30185188038:
      # "Cache not found" -> "bm25_no_saved_index" ->
      # "bm25_empty_index_returning_empty_list").
      #
      # The rebuild needs NO GPU, NO models, and NO re-embedding: the chunk
      # text is already stored in Qdrant payloads, so the index is rebuilt
      # straight from `BM25Document.from_payload()` (the `__main__` block in
      # app/retrieval/bm25_retriever.py). That makes Tier-1 self-sufficient on
      # a hosted runner and removes the self-hosted dependency entirely.
      # Rebuild on a cache miss OR on a cache hit that failed validation.
      - name: Rebuild BM25 index from Qdrant
        id: bm25_rebuild
        if: steps.bm25_cache.outputs.cache-hit != 'true' || steps.bm25_check.outputs.usable != 'true'
        run: |
          echo "Rebuilding BM25 index from Qdrant payloads (no GPU/model needed)."
          python -m app.retrieval.bm25_retriever --user_id "${EVAL_USER_ID}"

      # Fail loudly if the rebuild itself produced something unloadable, rather
      # than letting the gate run against a broken index and misreport the
      # result as a quality regression — the exact failure mode this whole
      # block exists to prevent.
      - name: Verify rebuilt BM25 index
        if: steps.bm25_rebuild.outcome == 'success'
        run: |
          python - <<'PY'
          import os, sys
          from app.retrieval.bm25_retriever import BM25Retriever
          uid = os.environ["EVAL_USER_ID"]
          r = BM25Retriever(user_id=uid)
          r._load_index(uid)
          n = len(r.documents)
          print(f"rebuilt index: {n} documents")
          if n == 0:
              print("::error title=BM25 rebuild produced an empty index::Refusing to score retrieval against an empty index.")
              sys.exit(1)
          PY

      # Persist the rebuilt index so subsequent runs take the fast path.
      - name: Save rebuilt BM25 index to cache
        if: steps.bm25_rebuild.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/users/${{ env.EVAL_USER_ID }}/bm25_index
          key: bm25-eval-index-v2-${{ hashFiles('app/eval/datasets/gold/**') }}

      - name: Retrieval gate
        run: python -m app.eval.run --suite retrieval
        # Exit code IS the gate (runner.check_thresholds()) — no separate
        # --gate flag exists in app/eval/run.py. Non-zero fails this job,
        # which GitHub branch protection should mark as a required check.
        #
        # thresholds.yaml's `gate_enabled` is per-section, not just a single
        # global switch: `retrieval.gate_enabled: true` (baseline v4, real
        # n=56 run, 2026-07-24) is what actually makes this job block — the
        # top-level `gate_enabled: false` is the default for every OTHER
        # suite (generation/e2e/behavioral/...), which are still on a stale
        # pre-Prometheus baseline and stay informational until each is
        # re-baselined on its own. See thresholds.yaml's header comment.

      # Pipeline observability, not RAG-quality dashboards (that's Phase 31 /
      # Grafana): surfaces pass/fail + metrics directly on the PR's Actions
      # run page, no external service needed.
      - name: Post report to job summary
        if: always()
        run: |
          echo "## Tier-1 Retrieval Gate" >> "$GITHUB_STEP_SUMMARY"
          if [ -f app/eval/reports/rag_report.md ]; then
            cat app/eval/reports/rag_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No report written — the run likely failed before scoring. Check the logs above._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-report-tier1-${{ github.event.pull_request.number }}
          path: app/eval/reports/
          retention-days: 30

  # ---------------------------------------------------------------------
  # SEED — manual only. Re-ingests the eval corpus on the box that actually
  # has data/raw/finance and publishes the resulting BM25 index to the cache
  # tier1-retrieval restores. Never triggered automatically.
  # ---------------------------------------------------------------------
  seed-eval-fixtures:
    if: github.event_name == 'workflow_dispatch' && inputs.seed == true
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180   # full multimodal re-ingest; never inherit the 6h default on a GPU box
    env:
      CONTAINER: magik-current
    steps:
      - uses: actions/checkout@v4

      # Runs in the deployed container for the same reasons as tier2-full-suite
      # above (deps, Qdrant credentials, and the persistent /opt/magik/data
      # mount where data/raw/finance and the BM25 indexes actually live — a
      # bare checkout has none of them).
      - name: Preflight — deployed container is running
        run: |
          set -uo pipefail
          if ! docker ps --filter "name=^/${CONTAINER}$" --filter status=running -q | grep -q .; then
            echo "::error title=Seed preflight failed::Container '${CONTAINER}' is not running. Deploy first (cd.yml), then re-run this job."
            exit 1
          fi

      - name: Ingest eval corpus (Qdrant + local BM25)
        run: |
          docker exec -e EVAL_USER_ID="${EVAL_USER_ID}" "$CONTAINER" \
            python3.12 -m app.eval.datasets.build_gold_set --ingest

      # Copy the freshly built index out of the container into the workspace,
      # laid out exactly as tier1-retrieval expects to restore it.
      - name: Extract BM25 index from container
        run: |
          set -uo pipefail
          rm -rf "data/users/${EVAL_USER_ID}/bm25_index"
          mkdir -p "data/users/${EVAL_USER_ID}"
          docker cp "${CONTAINER}:/app/data/users/${EVAL_USER_ID}/bm25_index" \
                    "data/users/${EVAL_USER_ID}/bm25_index"
          ls -la "data/users/${EVAL_USER_ID}/bm25_index"

      # NOTE THE `-v2-` SALT — it must match tier1-retrieval's restore key.
      # It did not: this job saved to an unsalted `bm25-eval-index-<hash>` key
      # while tier1 restores `bm25-eval-index-v2-<hash>`, so anything published
      # here was written to a key tier1 would never read. Harmless only because
      # tier1 self-heals by rebuilding from Qdrant; still a dead cache write.
      - name: Publish BM25 index cache
        uses: actions/cache/save@v4
        with:
          path: data/users/${{ env.EVAL_USER_ID }}/bm25_index
          key: bm25-eval-index-v2-${{ hashFiles('app/eval/datasets/gold/**') }}

  # ---------------------------------------------------------------------
  # TIER 2 — full generation + judge suite. Self-hosted on the real GPU box
  # ONLY. Needs the live API up (app/eval/run.py's generation suites call
  # /rag/query over HTTP) — cd.yml's deploy job must complete before this
  # is meaningfully triggered via repository_dispatch.
  # ---------------------------------------------------------------------
  tier2-full-suite:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.seed != true)
    runs-on: [self-hosted, gpu]
    # A full generation suite on 100+ gold rows through a 7B model is slow.
    # Without an explicit cap this inherits GitHub's 6h default and can pin a
    # $1.86/hr GPU box for a quarter of a day on a hung judge call. 180 min is
    # sized for the whole suite (retrieval + generation + judge + the modality
    # sub-suites) with headroom, since a timeout here reads as a red gate
    # rather than what it is.
    timeout-minutes: 180
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      CONTAINER: magik-current
    steps:
      - uses: actions/checkout@v4

      # ── Why this runs INSIDE the deployed container ──────────────────────
      # This job used to run `python -m app.eval.run` directly on the runner.
      # That could never have worked, and had never been executed once:
      #
      #   * no dependency install (unlike tier1's setup-python + pip install),
      #     so it relied on an interpreter+venv that nothing provisions — and
      #     a systemd-run runner does not inherit a login shell's PATH/venv;
      #   * no QDRANT_URL/QDRANT_API_KEY (tier1 maps them from secrets; repo
      #     secrets are NOT auto-injected), so retrieval — the one GATED
      #     sub-suite — would score against an unreachable vector store;
      #   * no BM25 index. DATA_DIR defaults to PROJECT_ROOT/data, i.e. the
      #     checkout, and actions/checkout runs `git clean -ffdx` which wipes
      #     gitignored data/. The BM25 half of hybrid retrieval would return
      #     empty and the gate would report a phantom "regression";
      #   * no EVAL_ACCESS_TOKEN, so every /rag/query call 401s
      #     (get_current_user is required on that route).
      #
      # Executing in the container the deploy just shipped fixes all four at
      # once — and is more correct besides: post-deploy eval should measure
      # the artifact actually serving traffic, not a git checkout beside it.
      # Deps, Qdrant credentials (--env-file /opt/magik/.env), the real BM25
      # index (/opt/magik/data mounted at /app/data) and the live server on
      # 127.0.0.1:8000 are all already there.
      - name: Preflight — deployed container is running, healthy, and has eval data
        run: |
          set -uo pipefail
          if ! docker ps --filter "name=^/${CONTAINER}$" --filter status=running -q | grep -q .; then
            echo "::error title=Tier-2 preflight failed::Container '${CONTAINER}' is not running. Tier-2 evaluates the deployed container; run cd.yml's deploy job first."
            exit 1
          fi

          ok=""
          for _ in $(seq 1 20); do
            if docker exec "$CONTAINER" curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              ok="yes"; break
            fi
            sleep 15
          done
          if [ -z "$ok" ]; then
            echo "::error title=Tier-2 preflight failed::/health did not answer within 5 minutes inside '${CONTAINER}'."
            docker logs --tail 60 "$CONTAINER" 2>&1 || true
            exit 1
          fi

          # Fail legibly on a missing corpus instead of scoring an empty index
          # and reporting it as a quality regression — the exact failure mode
          # tier1's cache-validation steps exist to prevent.
          #
          # The exact file the eval loads: retrieval_runner builds
          # HybridRetriever with infra.get_bm25(), which is
          # app/retrieval/bm25_retriever.BM25Retriever — NOT the per-modality
          # app/bm25/*_bm25.py classes. Its path is user_bm25_path(uid) with no
          # modality => data/users/<uid>/bm25_index/bm25.pkl. Checking for any
          # *.pkl here would pass on per-modality files while the file the eval
          # actually opens is missing, which is precisely the misleading
          # failure this preflight exists to prevent.
          #
          # app/utils/paths.py's DATA_ROOT is the RELATIVE path "data/users",
          # resolved against the process CWD — inside the container that is the
          # image's WORKDIR /app, where /opt/magik/data is mounted. That is
          # exactly why this must run in the container.
          if ! docker exec "$CONTAINER" \
               test -f "/app/data/users/${EVAL_USER_ID}/bm25_index/bm25.pkl"; then
            echo "::error title=Tier-2 preflight failed::Missing /app/data/users/${EVAL_USER_ID}/bm25_index/bm25.pkl inside the container. Retrieval would degrade to dense-only and the gate would report a false regression. Rebuild it from Qdrant payloads (no GPU, no re-embedding, no re-chunking): docker exec ${CONTAINER} python3.12 -m app.retrieval.bm25_retriever --user_id ${EVAL_USER_ID}"
            exit 1
          fi
          echo "preflight OK — container healthy, BM25 index present"

      # The token is minted and consumed inside a single step so it is never
      # written to a step output, a file, or the runner's env for other steps
      # to read. Signed with the container's own JWT_SECRET_KEY; get_current_user
      # builds the user straight from the payload (no DB lookup), so this
      # authenticates as the eval tenant without storing any credential.
      - name: Full suite (retrieval + generation + behavioral + routing + e2e + ocr/audio/video + regression)
        id: full_suite
        run: |
          set -uo pipefail
          # NOT `| tr -d '\r\n'` on the raw output — that blindly concatenates
          # every line docker exec prints. app/utils/logger.py's console
          # handler writes to stdout (StreamHandler(sys.stdout)), so importing
          # jwt_handler (which pulls in app.core.config, which logs
          # "logging_initialized" on first import) prints a banner line BEFORE
          # the token. tr -d only strips newlines, so banner+token got mashed
          # into one string — a garbled non-JWT sent as the Bearer header on
          # every single request. That's what actually killed the very first
          # Tier-2 run: every generation/e2e/behavioral/routing query failed
          # with a raw "invalid UTF-8 byte" header-decode error (retrieval was
          # unaffected — it doesn't use HTTP/auth at all), the suite ended in
          # ~15 minutes instead of hours, and the runner going idle afterward
          # is what let idle-stop legitimately (if confusingly) stop the box.
          #
          # Extract by SHAPE instead: a JWT is exactly three base64url segments
          # joined by dots, on its own line. Immune to any banner, warning, or
          # future log line printed before or after it, regardless of cause.
          RAW="$(docker exec "$CONTAINER" python3.12 -c \
            "from app.auth.jwt_handler import issue_tokens; print(issue_tokens('${EVAL_USER_ID}', 'eval@magik.local', 'user')['access_token'])")"
          TOKEN="$(printf '%s\n' "$RAW" | grep -oE '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$' | tail -n1)"
          if [ -z "$TOKEN" ]; then
            echo "::error title=Tier-2 token mint failed::Could not extract a JWT-shaped token from the container's output. Raw output (safe to show — no secret was successfully isolated, so nothing to mask): $RAW"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          docker exec \
            -e EVAL_USER_ID="${EVAL_USER_ID}" \
            -e EVAL_ACCESS_TOKEN="$TOKEN" \
            -e EVAL_SERVER_URL="http://127.0.0.1:8000" \
            "$CONTAINER" python3.12 -m app.eval.run --suite full
        # The `full` suite includes retrieval, which IS gated
        # (retrieval.gate_enabled: true, v5 production baseline). Every other
        # sub-suite here (generation, e2e, behavioral, ocr, audio, video,
        # routing) is still on the stale v3 baseline (pre-Prometheus-2-7B
        # judge, pre-164-row gold set) and stays informational-only via
        # thresholds.yaml's own per-section gate_enabled — this step can fail,
        # but only on a real retrieval regression, not on unverified
        # generation-suite numbers. See docs/runbooks/ci-cd.md for the
        # re-baseline procedure for the remaining sections.

      # Reports are written inside the container (/app/app/eval/reports, which
      # is chown'd to appuser in the Dockerfile). Copy them into the workspace
      # so the summary and artifact upload below can see them.
      - name: Extract reports from container
        if: always()
        run: |
          set -uo pipefail
          rm -rf "${GITHUB_WORKSPACE}/eval-reports"
          mkdir -p "${GITHUB_WORKSPACE}/eval-reports"
          docker cp "${CONTAINER}:/app/app/eval/reports/." "${GITHUB_WORKSPACE}/eval-reports/" 2>/dev/null \
            || echo "no reports produced (the suite likely failed before scoring)"

      # Phase 31 (System Design v2 §8 gap: "add RAG-quality SLOs (recall@k,
      # faithfulness) as first-class monitored signals, not just system
      # metrics") — this was left undone in the first Phase 31 pass: the
      # rag_quality.json dashboard only carried the online/live-sampled
      # LEXICAL faithfulness proxy, never the real gated numbers
      # (recall@5/10, MRR, nDCG, context_precision, hit_rate, the real
      # CrossEncoder+GGUF-judge faithfulness, hallucination_rate) that
      # thresholds.yaml actually gates on. Those numbers existed only in a
      # GitHub Actions log / job summary, invisible from Grafana. This step
      # closes that gap by pushing every numeric metric in rag_report.json to
      # the Pushgateway (docker-compose.monitoring.yml), generically — it
      # does not hardcode metric names, so it keeps working as suites gain or
      # rename metrics, with no changes needed here.
      #
      # Tier-1 (PR-time) deliberately does NOT push here: it runs on a
      # GitHub-hosted runner with no network path to the box's Pushgateway
      # (127.0.0.1-bound, same as Grafana), and its numbers are pre-merge
      # validation against an ephemeral checkout, not the production
      # container — conflating the two on one production dashboard would be
      # actively misleading, not just redundant.
      - name: Push eval metrics to Pushgateway
        if: always()
        run: |
          set -uo pipefail
          REPORT="${GITHUB_WORKSPACE}/eval-reports/rag_report.json"
          GATE="${GITHUB_WORKSPACE}/eval-reports/gate_result.json"
          if [ ! -f "$REPORT" ]; then
            echo "no rag_report.json — suite failed before scoring, nothing to push"
            exit 0
          fi

          python3 - "$REPORT" "$GATE" <<'PY' | curl -sf --data-binary @- \
            http://127.0.0.1:9091/metrics/job/magik_eval_gate \
            -X PUT || echo "::warning title=Pushgateway push failed::Prometheus dashboard will show stale numbers until the next successful Tier-2 run. Non-fatal — not blocking the job on a monitoring-sink outage."
          import json, math, sys, time

          report_path, gate_path = sys.argv[1], sys.argv[2]
          report = json.load(open(report_path))
          lines = []

          for suite_name, sr in (report.get("suites") or {}).items():
              for metric_name, m in (sr.get("metrics") or {}).items():
                  val = m.get("value")
                  if val is None:
                      continue
                  try:
                      val = float(val)
                  except (TypeError, ValueError):
                      continue
                  if math.isnan(val):
                      continue
                  # "full" suite metric names are prefixed ("retrieval.recall_at_5")
                  # — split so the label matches thresholds.yaml's own section
                  # names, same convention as app/eval/runner.py.
                  if "." in metric_name:
                      sub_suite, bare = metric_name.split(".", 1)
                  else:
                      sub_suite, bare = suite_name, metric_name
                  lines.append(
                      f'magik_eval_gate_metric_value{{suite="{sub_suite}",metric="{bare}"}} {val}'
                  )

          try:
              gate = json.load(open(gate_path))
              lines.append(f'magik_eval_gate_exit_code {int(gate.get("exit_code", -1))}')
          except Exception:
              pass

          lines.append(f"magik_eval_gate_last_run_timestamp {int(time.time())}")
          print("\n".join(lines))
          PY

      # Phase 31 — Tier-2 auto-rollback, scoped to a RETRIEVAL-section failure
      # ONLY (project memory "tier2-autorollback-deferred": explicitly
      # requested at Phase 30 close, deferred to "the final version").
      #
      # Why retrieval only: it's the one section with a validated, trustworthy
      # baseline (thresholds.yaml's v5 production numbers, gate_enabled: true).
      # Every other Tier-2 section (generation, e2e, behavioral, routing,
      # ocr/audio/video) is still informational-only against a stale
      # pre-Prometheus-judge baseline — a red result there doesn't reliably
      # indicate a real regression, so rolling back on it would risk reverting
      # good releases over noisy metrics. See thresholds.yaml's header.
      #
      # Why gate_result.json, not the step's exit code: the exit code alone
      # can't distinguish "retrieval regressed" from "a different gated
      # section regressed" (none are, today, but this must stay correct if
      # that changes) or "an unrelated infra error occurred". gate_result.json
      # (written by app/eval/run.py from app/eval/runner.py's
      # last_breached_sections/last_error_sections) carries that distinction.
      #
      # Why repository_dispatch only, not schedule/workflow_dispatch: a
      # rollback is only meaningful immediately after a fresh deploy, when
      # magik-previous is genuinely "the last known-good state before THIS
      # change". A nightly/manual Tier-2 run days later reacting to drift by
      # reverting to a possibly-stale (or already-pruned — see cd.yml's disk
      # cleanup, which sacrifices magik-previous under 40GB free) previous
      # image is not the same guarantee and is out of scope for this feature.
      #
      # Reuses the EXACT rollback sequence cd.yml's deploy job already uses on
      # its own health-check failure (docker rm -f / rename / start) — no SSM
      # needed, this job already runs ON the box as the self-hosted runner.
      - name: Auto-rollback on retrieval-section failure
        if: always() && github.event_name == 'repository_dispatch'
        id: rollback
        run: |
          set -uo pipefail
          REPORT="${GITHUB_WORKSPACE}/eval-reports/gate_result.json"
          echo "rolled_back=false" >> "$GITHUB_OUTPUT"

          if [ ! -f "$REPORT" ]; then
            echo "no gate_result.json — suite likely failed before scoring (crash/timeout), not a scored retrieval signal; not auto-rolling back on this alone"
            exit 0
          fi

          RETRIEVAL_FAILED=$(python3 - "$REPORT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          breached = set(data.get("breached_sections") or [])
          errored = set(data.get("error_sections") or [])
          print("true" if "retrieval" in breached or "retrieval" in errored else "false")
          PY
          )

          if [ "$RETRIEVAL_FAILED" != "true" ]; then
            echo "retrieval section did not breach/error — no rollback"
            exit 0
          fi

          echo "::warning title=Tier-2 retrieval-section failure — auto-rolling back::retrieval breached its gated threshold (or errored) on the deployed image. Reverting ${CONTAINER} to magik-previous."

          if ! docker inspect magik-previous >/dev/null 2>&1; then
            echo "::error title=Auto-rollback FAILED::retrieval section failed but no magik-previous image exists to roll back to (first deploy ever, or it was pruned under disk pressure — see cd.yml). Manual intervention required — see docs/runbooks/phase-30-aws-deployment.md Appendix H."
            exit 1
          fi

          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          docker rename magik-previous "$CONTAINER"
          docker start "$CONTAINER"

          echo "waiting for rolled-back container's /health"
          ok=""
          for _ in $(seq 1 20); do
            if docker exec "$CONTAINER" curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              ok="yes"; break
            fi
            sleep 15
          done

          echo "rolled_back=true" >> "$GITHUB_OUTPUT"
          if [ -z "$ok" ]; then
            echo "::error title=Auto-rollback completed but the rolled-back container is not healthy::Manual intervention required immediately — the box may now be fully down. See docs/runbooks/phase-30-aws-deployment.md Appendix H."
            exit 1
          fi
          echo "auto-rollback succeeded — ${CONTAINER} is back on the previous image and healthy"
          # Still fail the job on purpose: a rollback happened, which means
          # this deploy was bad — that must surface red, not silently pass,
          # matching cd.yml's own health-check rollback path (also exits 1
          # after a successful revert).
          exit 1

      - name: Post report to job summary
        if: always()
        run: |
          echo "## Tier-2 Full Eval Suite (${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.rollback.outputs.rolled_back }}" = "true" ]; then
            echo "**⚠️ AUTO-ROLLED BACK** — retrieval section failed Tier-2; ${CONTAINER} was reverted to the previous image. See the 'Auto-rollback' step log above." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f eval-reports/rag_report.md ]; then
            cat eval-reports/rag_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No report written — the run likely failed before scoring. Check the logs above._" >> "$GITHUB_STEP_SUMMARY"
          fi

      # No one watches a 3am scheduled run's Actions tab live — this is the
      # nightly/post-deploy tier, so failure needs to reach someone async.
      # No-op until SLACK_WEBHOOK_URL is set (repo secret) — see
      # docs/runbooks/ci-cd.md. Uses a plain incoming-webhook POST so it
      # works with Slack as-is and with Discord by swapping "text" for
      # "content" in the payload.
      - name: Notify on failure (Slack, optional)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          MSG="MAGIK Tier-2 eval suite FAILED (${{ github.event_name }}, run ${{ github.run_id }})"
          if [ "${{ steps.rollback.outputs.rolled_back }}" = "true" ]; then
            MSG="MAGIK Tier-2 retrieval-section failure — AUTO-ROLLED BACK to the previous image (run ${{ github.run_id }})"
          fi
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"text\": \"${MSG}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-report-tier2-${{ github.run_id }}
          path: eval-reports/
          retention-days: 90
          if-no-files-found: warn
