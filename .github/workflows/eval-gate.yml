name: Eval Gate

# Two-tier RAG-quality gate (see docs/runbooks/ci-cd.md for the full design
# rationale):
#
#   tier1-retrieval  — BM25 + Qdrant + BGE embedder, NO LLM generation.
#                       ~3GB RAM. Runs on every PR, on a standard hosted
#                       runner, and blocks merge on regression.
#
#   tier2-nightly     — full generation + Qwen2.5-7B judge suite, against
#                       PRODUCTION, informational only. Needs the full
#                       resident model stack (~17.7GB+ per CLAUDE.md's model
#                       catalog) AND a live running API (app/eval/run.py
#                       routes generation calls through HTTP to /rag/query,
#                       not in-process). This does not fit on any hosted CI
#                       runner or a 16GB laptop — it runs ONLY on the
#                       self-hosted runner registered on the real AWS GPU
#                       box, triggered by schedule / workflow_dispatch —
#                       deliberately NEVER by `pull_request`, since this is a
#                       public repo and a fork PR must never be able to
#                       execute on a self-hosted runner. The actual eval
#                       logic lives in tier2-eval.yml (a `workflow_call`
#                       reusable workflow) — this job is a thin caller into
#                       it, targeting magik-current. The BLOCKING copy of
#                       this same suite runs pre-promotion against staging;
#                       see cd.yml's `tier2-staging-gate`.
#
#   seed-eval-fixtures — one-off/maintainer job. The gold QA set
#                       (app/eval/datasets/gold/*.jsonl) is versioned in git,
#                       but the underlying ingested corpus (Qdrant vectors +
#                       local BM25 .pkl indexes under data/, per
#                       app/bm25/base_bm25.py) is NOT — data/ is gitignored
#                       and BM25 indexes are local files, not cloud state.
#                       This job (self-hosted only, manual) re-ingests
#                       data/raw/finance into the real Qdrant Cloud collection
#                       + local BM25 index, then publishes the BM25 index as
#                       a GitHub Actions cache that tier1-retrieval restores.
#                       Must be re-run whenever the gold set / corpus changes
#                       (cache key is keyed on the gold-set file hashes).
#
#   tier2-nightly       — thin caller into tier2-eval.yml (reusable workflow),
#                       targeting PRODUCTION (magik-current), informational
#                       only. Blocking Tier-2 now runs pre-promotion against
#                       STAGING instead — see cd.yml's `tier2-staging-gate`.
#                       This nightly run exists purely to catch drift on the
#                       already-live production image between releases.

on:
  # No paths-ignore on pull_request — same reasoning as ci.yml (see the note
  # there): a filtered-out workflow reports NO status, so a required check
  # would hang a doc-only PR on "waiting for status" forever. Public repo =
  # unlimited free minutes, so the skip bought nothing. workflow_dispatch/
  # schedule aren't file-change triggers, so path filtering never applied to
  # them either way.
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: "Run seed-eval-fixtures instead of tier2 (re-ingest eval corpus, refresh BM25 cache)"
        type: boolean
        default: false
  # NIGHTLY TIER-2 — DISABLED until a self-hosted GPU runner is registered.
  #
  # tier2-eval.yml's job is `runs-on: [self-hosted, gpu]`. With no such
  # runner registered, a scheduled run does not fail fast — it sits QUEUED
  # waiting for a matching runner that will never appear (observed: run
  # 30190058393 queued 3h+ and counting). That produces a permanently-yellow
  # workflow and daily noise that means nothing.
  #
  # Re-enable by uncommenting, as part of the Phase 30 AWS bring-up, once
  # `gh runner list` shows a runner with the `gpu` label online.
  # schedule:
  #   - cron: "0 3 * * *"   # nightly tier2 run

concurrency:
  group: eval-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a gate mid-run

permissions:
  contents: read

env:
  EVAL_USER_ID: ${{ vars.EVAL_USER_ID || 'eval_default' }}

jobs:
  # ---------------------------------------------------------------------
  # TIER 1 — blocks every PR. Hosted runner, no GPU, no live server needed
  # (retrieval_runner.py calls HybridRetriever in-process).
  # ---------------------------------------------------------------------
  tier1-retrieval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      DATA_DIR: ${{ github.workspace }}/data
      # Same reasoning as ci.yml's lint-type-test job: this is an in-process
      # retrieval-only eval (HybridRetriever called directly, no HTTP, no
      # auth flow), so AUTH_ENABLED=false avoids requiring a real
      # JWT_SECRET_KEY just to satisfy Settings.validate() at import time.
      ENV: test
      AUTH_ENABLED: "false"
      # Settings.validate() also rejects the "CHANGE_ME_IN_PRODUCTION"
      # default for SECRET_KEY/JWT_SECRET_KEY whenever ENV != "development",
      # independent of AUTH_ENABLED above. Placeholder values only, never
      # used to sign anything real.
      SECRET_KEY: "ci-test-only-placeholder-secret-not-a-real-credential"
      JWT_SECRET_KEY: "ci-test-only-placeholder-jwt-secret-not-a-real-credential"
    steps:
      - uses: actions/checkout@v4

      # Fail in 5 seconds with the actual reason, instead of ~20 minutes of
      # installing torch and then scoring an empty index as "recall regressed".
      # That is exactly how this gate first failed for real (run 30185188038):
      # no QDRANT_* secrets were configured, so retrieval had no data source at
      # all, and the resulting red check read as a quality regression rather
      # than "the gate is unconfigured". A gate that can't distinguish "broken"
      # from "regressed" trains people to ignore it.
      - name: Preflight — required eval configuration
        env:
          TRIGGERING_ACTOR: ${{ github.actor }}
        run: |
          missing=""
          [ -z "${QDRANT_URL}" ] && missing="${missing} QDRANT_URL"
          [ -z "${QDRANT_API_KEY}" ] && missing="${missing} QDRANT_API_KEY"
          if [ -n "${missing}" ]; then
            if [ "${TRIGGERING_ACTOR}" = "dependabot[bot]" ]; then
              # Dependabot-triggered runs are DENIED repository Actions secrets
              # by design (GitHub security model) — they read from a separate
              # "Dependabot secrets" store instead. Every early failure of this
              # gate was exactly this: the runs were all on dependabot/* branches,
              # and the generic "add your secrets" message would have sent you to
              # the wrong settings page. The same values must be added TWICE,
              # under both stores, with identical names.
              echo "::error title=Eval gate: missing Dependabot secrets::Missing:${missing}. This run was triggered by Dependabot, which cannot read repository Actions secrets. Add the SAME values under Settings -> Secrets and variables -> Dependabot (not Actions). See docs/runbooks/ci-cd.md."
            else
              echo "::error title=Eval gate not configured::Missing:${missing}. Tier-1 scores retrieval against the real Qdrant collection; without these it has no corpus and would report a false regression. Add them under Settings -> Secrets and variables -> Actions. See docs/runbooks/ci-cd.md."
            fi
            exit 1
          fi
          if [ "${EVAL_USER_ID}" = "eval_default" ]; then
            echo "::warning title=EVAL_USER_ID is the fallback::Using 'eval_default'. If your ingested eval corpus lives under a different user_id, set the EVAL_USER_ID repository variable or this gate will score an empty tenant."
          fi

      # NO `cache: pip` — see the long note in ci.yml's lint-type-test job.
      # Short version: caching pip here stores ~4.8GB of torch/CUDA wheels and
      # crowds cd.yml's Docker buildx cache out of the 10GB per-repo limit,
      # turning every release build into a ~1h llama-cpp-python recompile.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinning the CPU torchcodec wheel (below) fixed the libnvrtc.so.13/CUDA
      # crash, but exposed the next layer: torchcodec's wheel has no bundled
      # FFmpeg — it dynamically loads libavutil.so/libavcodec.so etc. from
      # the system at import time. This hosted runner's preinstalled ffmpeg
      # is a static tool-cache binary with no matching shared libraries, so
      # every one of torchcodec's supported FFmpeg versions (4-8) failed to
      # dlopen — confirmed live (2026-08-01, run 30681177552): "OSError:
      # libavutil.so.60/59/58/57/56: cannot open shared object file", which
      # again crashed the same pure-text BGE embedder load and failed
      # retriever_init as a gate breach. apt's ffmpeg package (unlike the
      # tool-cache one) ships real libavutil/libavcodec/libswscale .so files.
      - name: Install ffmpeg (shared libs for torchcodec)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same reasoning as ci.yml's lint-type-test job: this hosted runner
          # has no GPU/driver, and a bare `pip install -r requirements.txt`
          # resolves torch>=2.6 as a CUDA build from PyPI's default index —
          # pin the CPU wheel explicitly first per requirements.txt's own
          # header, since HybridRetriever here loads the BGE embedder
          # in-process (torch import at collection/call time either way).
          #
          # torchcodec included here too — it's torchaudio's own transitive
          # dependency (modern torchaudio delegates torchaudio.load() to it),
          # not declared directly in requirements.txt, so without pinning it
          # to this same CPU index pip resolved it from PyPI's default index
          # instead and got a build whose .so files hard-require
          # libnvrtc.so.13 (CUDA runtime) just to *import*, even though
          # nothing here ever touches audio decoding — confirmed live
          # (2026-07-31): a plain text_embedder (BGE) load crashed
          # retriever_init entirely, failing the whole Tier-1 gate, because
          # something in the transformers/sentence-transformers import chain
          # eagerly probes torchaudio (which eagerly probes torchcodec) even
          # when loading a pure-text model that never needs either.
          pip install torch torchvision torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # BM25 index for EVAL_USER_ID is gitignored local state (data/), not
      # reproducible from a bare checkout. Try the cache first (fast path).
      #
      # NOTE THE `-v2-` SALT. It is load-bearing, not cosmetic. The first run
      # of this job saved an index pickled while
      # app/retrieval/bm25_retriever.py was executing as `__main__`, so every
      # BM25Document recorded its class as `__main__.BM25Document` and no
      # other process could unpickle it. Fixing the source was not enough:
      # the poisoned artifact was already in the cache, the cache then HIT on
      # every later run, the rebuild step was skipped by its own
      # `cache-hit != 'true'` guard, and the fix never executed. Cache keys are
      # immutable, so the only way to publish a corrected artifact is a new
      # key. Bump this salt whenever the pickled schema or the code that
      # produces it changes incompatibly.
      # `restore-keys` is salted too — a bare `bm25-eval-index-` prefix would
      # happily fall back to the very poisoned entry we are escaping.
      - name: Restore eval BM25 index
        id: bm25_cache
        uses: actions/cache/restore@v6
        with:
          path: data/users/${{ env.EVAL_USER_ID }}/bm25_index
          key: bm25-eval-index-v2-${{ hashFiles('app/eval/datasets/gold/**') }}
          restore-keys: |
            bm25-eval-index-v2-

      # A cache HIT is not proof of a USABLE index — that assumption is
      # exactly what let a corrupt artifact silently degrade the gate to
      # dense-only for two full runs while reporting it as a retrieval
      # regression. Actually open it and check it loads with documents.
      # Cheap (no models, no network) and turns a whole class of
      # stale/corrupt-cache failures into an automatic rebuild.
      - name: Validate restored BM25 index
        id: bm25_check
        if: steps.bm25_cache.outputs.cache-hit == 'true'
        run: |
          set +e
          python - <<'PY'
          import sys
          from app.retrieval.bm25_retriever import BM25Retriever
          import os
          uid = os.environ["EVAL_USER_ID"]
          try:
              r = BM25Retriever(user_id=uid)
              r._load_index(uid)
              n = len(r.documents)
          except Exception as exc:
              print(f"restored index unusable: {exc}")
              sys.exit(1)
          if n == 0:
              print("restored index loaded but contains 0 documents")
              sys.exit(1)
          print(f"restored index OK: {n} documents")
          PY
          if [ $? -eq 0 ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=BM25 cache unusable::Restored cache failed to load; rebuilding from Qdrant."
          fi

      # Self-heal on a cache miss instead of scoring an empty index.
      #
      # The original design expected `seed-eval-fixtures` to publish this
      # cache — but that job is `runs-on: [self-hosted, gpu]` and
      # workflow_dispatch-only, so on a repo with no self-hosted runner
      # registered the cache could NEVER be populated, and every PR's Tier-1
      # run scored recall against an empty BM25 index and failed. That is
      # precisely what happened on every PR until now (see run 30185188038:
      # "Cache not found" -> "bm25_no_saved_index" ->
      # "bm25_empty_index_returning_empty_list").
      #
      # The rebuild needs NO GPU, NO models, and NO re-embedding: the chunk
      # text is already stored in Qdrant payloads, so the index is rebuilt
      # straight from `BM25Document.from_payload()` (the `__main__` block in
      # app/retrieval/bm25_retriever.py). That makes Tier-1 self-sufficient on
      # a hosted runner and removes the self-hosted dependency entirely.
      # Rebuild on a cache miss OR on a cache hit that failed validation.
      - name: Rebuild BM25 index from Qdrant
        id: bm25_rebuild
        if: steps.bm25_cache.outputs.cache-hit != 'true' || steps.bm25_check.outputs.usable != 'true'
        run: |
          echo "Rebuilding BM25 index from Qdrant payloads (no GPU/model needed)."
          python -m app.retrieval.bm25_retriever --user_id "${EVAL_USER_ID}"

      # Fail loudly if the rebuild itself produced something unloadable, rather
      # than letting the gate run against a broken index and misreport the
      # result as a quality regression — the exact failure mode this whole
      # block exists to prevent.
      - name: Verify rebuilt BM25 index
        if: steps.bm25_rebuild.outcome == 'success'
        run: |
          python - <<'PY'
          import os, sys
          from app.retrieval.bm25_retriever import BM25Retriever
          uid = os.environ["EVAL_USER_ID"]
          r = BM25Retriever(user_id=uid)
          r._load_index(uid)
          n = len(r.documents)
          print(f"rebuilt index: {n} documents")
          if n == 0:
              print("::error title=BM25 rebuild produced an empty index::Refusing to score retrieval against an empty index.")
              sys.exit(1)
          PY

      # Persist the rebuilt index so subsequent runs take the fast path.
      - name: Save rebuilt BM25 index to cache
        if: steps.bm25_rebuild.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: data/users/${{ env.EVAL_USER_ID }}/bm25_index
          key: bm25-eval-index-v2-${{ hashFiles('app/eval/datasets/gold/**') }}

      - name: Retrieval gate
        run: python -m app.eval.run --suite retrieval
        # Exit code IS the gate (runner.check_thresholds()) — no separate
        # --gate flag exists in app/eval/run.py. Non-zero fails this job,
        # which GitHub branch protection should mark as a required check.
        #
        # thresholds.yaml's `gate_enabled` is per-section, not just a single
        # global switch: `retrieval.gate_enabled: true` (baseline v4, real
        # n=56 run, 2026-07-24) is what actually makes this job block — the
        # top-level `gate_enabled: false` is the default for every OTHER
        # suite (generation/e2e/behavioral/...), which are still on a stale
        # pre-Prometheus baseline and stay informational until each is
        # re-baselined on its own. See thresholds.yaml's header comment.

      # Pipeline observability, not RAG-quality dashboards (that's Phase 31 /
      # Grafana): surfaces pass/fail + metrics directly on the PR's Actions
      # run page, no external service needed.
      - name: Post report to job summary
        if: always()
        run: |
          echo "## Tier-1 Retrieval Gate" >> "$GITHUB_STEP_SUMMARY"
          if [ -f app/eval/reports/rag_report.md ]; then
            cat app/eval/reports/rag_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No report written — the run likely failed before scoring. Check the logs above._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-report-tier1-${{ github.event.pull_request.number }}
          path: app/eval/reports/
          retention-days: 30

  # ---------------------------------------------------------------------
  # SEED — manual only. Re-ingests the eval corpus on the box that actually
  # has data/raw/finance and publishes the resulting BM25 index to the cache
  # tier1-retrieval restores. Never triggered automatically.
  # ---------------------------------------------------------------------
  seed-eval-fixtures:
    if: github.event_name == 'workflow_dispatch' && inputs.seed == true
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180   # full multimodal re-ingest; never inherit the 6h default on a GPU box
    env:
      CONTAINER: magik-current
    steps:
      - uses: actions/checkout@v4

      # Runs in the deployed container for the same reasons as tier2-eval.yml's
      # job (deps, Qdrant credentials, and the persistent /opt/magik/data
      # mount where data/raw/finance and the BM25 indexes actually live — a
      # bare checkout has none of them).
      - name: Preflight — deployed container is running
        run: |
          set -uo pipefail
          if ! docker ps --filter "name=^/${CONTAINER}$" --filter status=running -q | grep -q .; then
            echo "::error title=Seed preflight failed::Container '${CONTAINER}' is not running. Deploy first (cd.yml), then re-run this job."
            exit 1
          fi

      - name: Ingest eval corpus (Qdrant + local BM25)
        run: |
          docker exec -e EVAL_USER_ID="${EVAL_USER_ID}" "$CONTAINER" \
            python3.12 -m app.eval.datasets.build_gold_set --ingest

      # Copy the freshly built index out of the container into the workspace,
      # laid out exactly as tier1-retrieval expects to restore it.
      - name: Extract BM25 index from container
        run: |
          set -uo pipefail
          rm -rf "data/users/${EVAL_USER_ID}/bm25_index"
          mkdir -p "data/users/${EVAL_USER_ID}"
          docker cp "${CONTAINER}:/app/data/users/${EVAL_USER_ID}/bm25_index" \
                    "data/users/${EVAL_USER_ID}/bm25_index"
          ls -la "data/users/${EVAL_USER_ID}/bm25_index"

      # NOTE THE `-v2-` SALT — it must match tier1-retrieval's restore key.
      # It did not: this job saved to an unsalted `bm25-eval-index-<hash>` key
      # while tier1 restores `bm25-eval-index-v2-<hash>`, so anything published
      # here was written to a key tier1 would never read. Harmless only because
      # tier1 self-heals by rebuilding from Qdrant; still a dead cache write.
      - name: Publish BM25 index cache
        uses: actions/cache/save@v6
        with:
          path: data/users/${{ env.EVAL_USER_ID }}/bm25_index
          key: bm25-eval-index-v2-${{ hashFiles('app/eval/datasets/gold/**') }}

  # ---------------------------------------------------------------------
  # TIER 2 (nightly, production, informational) — thin caller into
  # tier2-eval.yml, the reusable workflow holding the actual full
  # generation + judge suite logic. Needs the live API up in the target
  # container; cd.yml's promote-production job must have completed before
  # this run is meaningful.
  #
  # This is deliberately NOT the gate that decides whether a release ships —
  # that gate is cd.yml's `tier2-staging-gate`, which runs the SAME reusable
  # workflow against staging BEFORE production is ever touched. This nightly
  # run exists only to catch drift on the already-live production image
  # between releases (e.g. an external dependency regressing quality with no
  # code change on our side).
  # ---------------------------------------------------------------------
  tier2-nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.seed != true)
    uses: ./.github/workflows/tier2-eval.yml
    secrets: inherit  # pragma: allowlist secret
    with:
      container: magik-current
      previous_container: magik-previous
      runner_label: gpu
      environment_label: production
      runner_available: ${{ vars.SELF_HOSTED_GPU_RUNNER == 'true' }}
