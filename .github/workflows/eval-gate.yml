name: Eval Gate

# Two-tier RAG-quality gate (see docs/runbooks/ci-cd.md for the full design
# rationale):
#
#   tier1-retrieval  — BM25 + Qdrant + BGE embedder, NO LLM generation.
#                       ~3GB RAM. Runs on every PR, on a standard hosted
#                       runner, and blocks merge on regression.
#
#   tier2-full-suite — full generation + Prometheus-2-7B judge suite.
#                       Needs the full resident model stack (~17.7GB+ per
#                       CLAUDE.md's model catalog) AND a live running API
#                       (app/eval/run.py routes generation calls through
#                       HTTP to /rag/query, not in-process). This does not
#                       fit on any hosted CI runner or a 16GB laptop —
#                       it runs ONLY on the self-hosted runner registered on
#                       the real AWS GPU box, triggered by schedule /
#                       workflow_dispatch / repository_dispatch — deliberately
#                       NEVER by `pull_request`, since this is a public repo
#                       and a fork PR must never be able to execute on a
#                       self-hosted runner.
#
#   seed-eval-fixtures — one-off/maintainer job. The gold QA set
#                       (app/eval/datasets/gold/*.jsonl) is versioned in git,
#                       but the underlying ingested corpus (Qdrant vectors +
#                       local BM25 .pkl indexes under data/, per
#                       app/bm25/base_bm25.py) is NOT — data/ is gitignored
#                       and BM25 indexes are local files, not cloud state.
#                       This job (self-hosted only, manual) re-ingests
#                       data/raw/finance into the real Qdrant Cloud collection
#                       + local BM25 index, then publishes the BM25 index as
#                       a GitHub Actions cache that tier1-retrieval restores.
#                       Must be re-run whenever the gold set / corpus changes
#                       (cache key is keyed on the gold-set file hashes).

on:
  # No paths-ignore on pull_request — same reasoning as ci.yml (see the note
  # there): a filtered-out workflow reports NO status, so a required check
  # would hang a doc-only PR on "waiting for status" forever. Public repo =
  # unlimited free minutes, so the skip bought nothing. workflow_dispatch/
  # schedule/repository_dispatch aren't file-change triggers, so path
  # filtering never applied to them either way.
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: "Run seed-eval-fixtures instead of tier2 (re-ingest eval corpus, refresh BM25 cache)"
        type: boolean
        default: false
  # NIGHTLY TIER-2 — DISABLED until a self-hosted GPU runner is registered.
  #
  # tier2-full-suite is `runs-on: [self-hosted, gpu]`. With no such runner
  # registered, a scheduled run does not fail fast — it sits QUEUED waiting
  # for a matching runner that will never appear (observed: run 30190058393
  # queued 3h+ and counting). That produces a permanently-yellow workflow and
  # daily noise that means nothing.
  #
  # Re-enable by uncommenting, as part of the Phase 30 AWS bring-up, once
  # `gh runner list` shows a runner with the `gpu` label online.
  # schedule:
  #   - cron: "0 3 * * *"   # nightly tier2 run
  repository_dispatch:
    types: [post-deploy-eval]   # triggered by cd.yml after a successful deploy

concurrency:
  group: eval-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a gate mid-run

permissions:
  contents: read

env:
  EVAL_USER_ID: ${{ vars.EVAL_USER_ID || 'eval_default' }}

jobs:
  # ---------------------------------------------------------------------
  # TIER 1 — blocks every PR. Hosted runner, no GPU, no live server needed
  # (retrieval_runner.py calls HybridRetriever in-process).
  # ---------------------------------------------------------------------
  tier1-retrieval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      DATA_DIR: ${{ github.workspace }}/data
      # Same reasoning as ci.yml's lint-type-test job: this is an in-process
      # retrieval-only eval (HybridRetriever called directly, no HTTP, no
      # auth flow), so AUTH_ENABLED=false avoids requiring a real
      # JWT_SECRET_KEY just to satisfy Settings.validate() at import time.
      ENV: test
      AUTH_ENABLED: "false"
      # Settings.validate() also rejects the "CHANGE_ME_IN_PRODUCTION"
      # default for SECRET_KEY/JWT_SECRET_KEY whenever ENV != "development",
      # independent of AUTH_ENABLED above. Placeholder values only, never
      # used to sign anything real.
      SECRET_KEY: "ci-test-only-placeholder-secret-not-a-real-credential"
      JWT_SECRET_KEY: "ci-test-only-placeholder-jwt-secret-not-a-real-credential"
    steps:
      - uses: actions/checkout@v4

      # Fail in 5 seconds with the actual reason, instead of ~20 minutes of
      # installing torch and then scoring an empty index as "recall regressed".
      # That is exactly how this gate first failed for real (run 30185188038):
      # no QDRANT_* secrets were configured, so retrieval had no data source at
      # all, and the resulting red check read as a quality regression rather
      # than "the gate is unconfigured". A gate that can't distinguish "broken"
      # from "regressed" trains people to ignore it.
      - name: Preflight — required eval configuration
        env:
          TRIGGERING_ACTOR: ${{ github.actor }}
        run: |
          missing=""
          [ -z "${QDRANT_URL}" ] && missing="${missing} QDRANT_URL"
          [ -z "${QDRANT_API_KEY}" ] && missing="${missing} QDRANT_API_KEY"
          if [ -n "${missing}" ]; then
            if [ "${TRIGGERING_ACTOR}" = "dependabot[bot]" ]; then
              # Dependabot-triggered runs are DENIED repository Actions secrets
              # by design (GitHub security model) — they read from a separate
              # "Dependabot secrets" store instead. Every early failure of this
              # gate was exactly this: the runs were all on dependabot/* branches,
              # and the generic "add your secrets" message would have sent you to
              # the wrong settings page. The same values must be added TWICE,
              # under both stores, with identical names.
              echo "::error title=Eval gate: missing Dependabot secrets::Missing:${missing}. This run was triggered by Dependabot, which cannot read repository Actions secrets. Add the SAME values under Settings -> Secrets and variables -> Dependabot (not Actions). See docs/runbooks/ci-cd.md."
            else
              echo "::error title=Eval gate not configured::Missing:${missing}. Tier-1 scores retrieval against the real Qdrant collection; without these it has no corpus and would report a false regression. Add them under Settings -> Secrets and variables -> Actions. See docs/runbooks/ci-cd.md."
            fi
            exit 1
          fi
          if [ "${EVAL_USER_ID}" = "eval_default" ]; then
            echo "::warning title=EVAL_USER_ID is the fallback::Using 'eval_default'. If your ingested eval corpus lives under a different user_id, set the EVAL_USER_ID repository variable or this gate will score an empty tenant."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same reasoning as ci.yml's lint-type-test job: this hosted runner
          # has no GPU/driver, and a bare `pip install -r requirements.txt`
          # resolves torch>=2.6 as a CUDA build from PyPI's default index —
          # pin the CPU wheel explicitly first per requirements.txt's own
          # header, since HybridRetriever here loads the BGE embedder
          # in-process (torch import at collection/call time either way).
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # BM25 index for EVAL_USER_ID is gitignored local state (data/), not
      # reproducible from a bare checkout. Try the cache first (fast path).
      - name: Restore eval BM25 index
        id: bm25_cache
        uses: actions/cache/restore@v4
        with:
          path: data/users/${{ env.EVAL_USER_ID }}/bm25_index
          key: bm25-eval-index-${{ hashFiles('app/eval/datasets/gold/**') }}
          restore-keys: |
            bm25-eval-index-

      # Self-heal on a cache miss instead of scoring an empty index.
      #
      # The original design expected `seed-eval-fixtures` to publish this
      # cache — but that job is `runs-on: [self-hosted, gpu]` and
      # workflow_dispatch-only, so on a repo with no self-hosted runner
      # registered the cache could NEVER be populated, and every PR's Tier-1
      # run scored recall against an empty BM25 index and failed. That is
      # precisely what happened on every PR until now (see run 30185188038:
      # "Cache not found" -> "bm25_no_saved_index" ->
      # "bm25_empty_index_returning_empty_list").
      #
      # The rebuild needs NO GPU, NO models, and NO re-embedding: the chunk
      # text is already stored in Qdrant payloads, so the index is rebuilt
      # straight from `BM25Document.from_payload()` (the `__main__` block in
      # app/retrieval/bm25_retriever.py). That makes Tier-1 self-sufficient on
      # a hosted runner and removes the self-hosted dependency entirely.
      - name: Rebuild BM25 index from Qdrant (cache miss)
        if: steps.bm25_cache.outputs.cache-hit != 'true'
        run: |
          echo "BM25 cache miss — rebuilding from Qdrant payloads (no GPU/model needed)."
          python -m app.retrieval.bm25_retriever --user_id "${EVAL_USER_ID}"

      # Persist the rebuilt index so subsequent runs take the fast path.
      - name: Save rebuilt BM25 index to cache
        if: steps.bm25_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/users/${{ env.EVAL_USER_ID }}/bm25_index
          key: bm25-eval-index-${{ hashFiles('app/eval/datasets/gold/**') }}

      - name: Retrieval gate
        run: python -m app.eval.run --suite retrieval
        # Exit code IS the gate (runner.check_thresholds()) — no separate
        # --gate flag exists in app/eval/run.py. Non-zero fails this job,
        # which GitHub branch protection should mark as a required check.
        #
        # thresholds.yaml's `gate_enabled` is per-section, not just a single
        # global switch: `retrieval.gate_enabled: true` (baseline v4, real
        # n=56 run, 2026-07-24) is what actually makes this job block — the
        # top-level `gate_enabled: false` is the default for every OTHER
        # suite (generation/e2e/behavioral/...), which are still on a stale
        # pre-Prometheus baseline and stay informational until each is
        # re-baselined on its own. See thresholds.yaml's header comment.

      # Pipeline observability, not RAG-quality dashboards (that's Phase 31 /
      # Grafana): surfaces pass/fail + metrics directly on the PR's Actions
      # run page, no external service needed.
      - name: Post report to job summary
        if: always()
        run: |
          echo "## Tier-1 Retrieval Gate" >> "$GITHUB_STEP_SUMMARY"
          if [ -f app/eval/reports/rag_report.md ]; then
            cat app/eval/reports/rag_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No report written — the run likely failed before scoring. Check the logs above._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-report-tier1-${{ github.event.pull_request.number }}
          path: app/eval/reports/
          retention-days: 30

  # ---------------------------------------------------------------------
  # SEED — manual only. Re-ingests the eval corpus on the box that actually
  # has data/raw/finance and publishes the resulting BM25 index to the cache
  # tier1-retrieval restores. Never triggered automatically.
  # ---------------------------------------------------------------------
  seed-eval-fixtures:
    if: github.event_name == 'workflow_dispatch' && inputs.seed == true
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4

      - name: Ingest eval corpus (Qdrant + local BM25)
        run: python -m app.eval.datasets.build_gold_set --ingest

      - name: Publish BM25 index cache
        uses: actions/cache/save@v4
        with:
          path: data/users/${{ env.EVAL_USER_ID }}/bm25_index
          key: bm25-eval-index-${{ hashFiles('app/eval/datasets/gold/**') }}

  # ---------------------------------------------------------------------
  # TIER 2 — full generation + judge suite. Self-hosted on the real GPU box
  # ONLY. Needs the live API up (app/eval/run.py's generation suites call
  # /rag/query over HTTP) — cd.yml's deploy job must complete before this
  # is meaningfully triggered via repository_dispatch.
  # ---------------------------------------------------------------------
  tier2-full-suite:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.seed != true)
    runs-on: [self-hosted, gpu]
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Full suite (retrieval + generation + behavioral + routing + e2e + ocr/audio/video + regression)
        id: full_suite
        run: python -m app.eval.run --suite full
        # The `full` suite includes retrieval, which IS gated now
        # (retrieval.gate_enabled: true, baseline v4 — see eval-gate.yml's
        # tier1 job comment). Every other sub-suite here (generation, e2e,
        # behavioral, ocr, audio, video, routing) is still on the stale v3
        # baseline (pre-Prometheus-2-7B judge, pre-164-row gold set) and
        # stays informational-only via thresholds.yaml's own per-section
        # gate_enabled — this step can still fail today, but only on a real
        # retrieval regression, not on unverified generation-suite numbers.
        # See docs/runbooks/ci-cd.md for the re-baseline procedure for the
        # remaining sections. Once each is enabled, a non-zero exit here
        # should trigger the rollback path in cd.yml.

      - name: Post report to job summary
        if: always()
        run: |
          echo "## Tier-2 Full Eval Suite (${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -f app/eval/reports/rag_report.md ]; then
            cat app/eval/reports/rag_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No report written — the run likely failed before scoring. Check the logs above._" >> "$GITHUB_STEP_SUMMARY"
          fi

      # No one watches a 3am scheduled run's Actions tab live — this is the
      # nightly/post-deploy tier, so failure needs to reach someone async.
      # No-op until SLACK_WEBHOOK_URL is set (repo secret) — see
      # docs/runbooks/ci-cd.md. Uses a plain incoming-webhook POST so it
      # works with Slack as-is and with Discord by swapping "text" for
      # "content" in the payload.
      - name: Notify on failure (Slack, optional)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"text\": \"MAGIK Tier-2 eval suite FAILED (${{ github.event_name }}, run ${{ github.run_id }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-report-tier2-${{ github.run_id }}
          path: app/eval/reports/
          retention-days: 90
