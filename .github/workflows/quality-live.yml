name: Quality & Performance (live)

# Manual, on-demand ONLY — workflow_dispatch, never push/pull_request/schedule.
# Every job here targets the REAL deployed URL, which wakes the wake-on-demand
# AWS box (deploy/aws/lambda/wake_gateway/) if it's asleep. That's an accepted
# cost for a portfolio project with low real traffic (see the approved plan),
# but it must always be a deliberate human action — a human clicking "Run
# workflow" and picking exactly one tool, never something that fires on a
# schedule or as a side effect of a PR.
#
# ZAP's active scan is deliberately NOT an option here — security/zap/
# run_active_scan.sh is interactive by design (a real-time confirmation
# pause) and is meant to be run locally by a human watching the output, not
# from a CI runner. See that script's docstring.
#
# Requires repo secrets: MAGIK_LIVE_URL (the real deployed URL) and
# MAGIK_TEST_TENANTS (JSON from app/bin/seed_test_tenants.py — dedicated test
# tenants, never the shared public demo login). Set these once in
# Settings -> Secrets and variables -> Actions before the first run.
#
# NO RAGAS / DEEPEVAL HERE — see .github/workflows/quality-report.yml instead.
# Both options used to live in the list below and neither could ever have
# produced a real number from this workflow. app/eval/judges/qwen_judge.py runs
# Qwen2.5-7B-Instruct Q4_K_M as a local process and `_start_worker()` does NOT
# download it — it raises when the ~4.7GB GGUF is absent, which it always is on
# a hosted runner (data/ and .hf_cache are gitignored, and checkout runs
# `git clean -ffdx`). Ragas catches that and silently re-scores with the crude
# lexical fallback, so the run went GREEN while publishing a number no judge
# ever computed; DeepEval errored every row. A broken path that stays clickable
# gets clicked, so they were removed rather than annotated. The replacement runs
# in-container on the staging GPU box, where the judge, Qdrant credentials and
# BM25 index all actually exist.
#
# EVAL_REPORTER_EMAIL / EVAL_REPORTER_PASSWORD (from app/bin/seed_eval_reporter.py)
# are consequently unused by this workflow now. They are left in the repo
# secrets deliberately: they are the only way to drive the server from OUTSIDE
# its secret boundary, which is what any future live-URL check would need.
on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Which live-mode check to run"
        required: true
        type: choice
        options:
          - schemathesis
          - k6-live-profile
          - k6-multiuser
          - lighthouse
          - zap-baseline

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.tool }} (live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Warn this wakes the live box
        run: echo "::notice::Targeting ${{ inputs.tool }} against the live deployed URL — this wakes the AWS box if it's asleep."

      - uses: actions/setup-python@v7
        if: inputs.tool == 'schemathesis'
        with:
          python-version: "3.11"

      - name: Schemathesis (live, GET-only)
        if: inputs.tool == 'schemathesis'
        env:
          MAGIK_LIVE_URL: ${{ secrets.MAGIK_LIVE_URL }}
        run: |
          pip install "schemathesis>=4.24,<5"
          bash scripts/schemathesis_live.sh

      - uses: grafana/setup-k6-action@v1
        if: contains(fromJSON('["k6-live-profile","k6-multiuser"]'), inputs.tool)

      - name: k6 live profile
        if: inputs.tool == 'k6-live-profile'
        env:
          MAGIK_API_BASE_URL: ${{ secrets.MAGIK_LIVE_URL }}
          MAGIK_TEST_TENANTS: ${{ secrets.MAGIK_TEST_TENANTS }}
        run: k6 run perf/k6/live_profile.js

      - name: k6 multi-user tenant isolation (live)
        if: inputs.tool == 'k6-multiuser'
        env:
          MAGIK_API_BASE_URL: ${{ secrets.MAGIK_LIVE_URL }}
          MAGIK_TEST_TENANTS: ${{ secrets.MAGIK_TEST_TENANTS }}
        run: k6 run --vus 5 --iterations 15 perf/k6/multi_user_tenant.js

      - uses: actions/setup-node@v7
        if: inputs.tool == 'lighthouse'
        with:
          node-version: "20"

      - name: Lighthouse (live)
        if: inputs.tool == 'lighthouse'
        run: |
          npx --yes lighthouse "${{ secrets.MAGIK_LIVE_URL }}" \
            --output=html --output=json \
            --output-path=quality-reports/browser-performance/ci-live \
            --only-categories=performance,accessibility,best-practices \
            --chrome-flags="--headless --no-sandbox"

      - name: ZAP baseline (live, passive/safe)
        if: inputs.tool == 'zap-baseline'
        env:
          TARGET_URL: ${{ secrets.MAGIK_LIVE_URL }}
        run: bash security/zap/run_baseline.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-live-${{ inputs.tool }}
          path: quality-reports/**
          retention-days: 30
