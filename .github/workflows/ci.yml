name: CI

# Fast, hermetic checks — lint, types, unit tests. No models, no GPU, no
# external services. This is the trust signal that gates every PR; the
# RAG-quality gate lives in eval-gate.yml (needs real data/infra — see there).
#
# NO paths-ignore on pull_request — deliberate, and the reasoning matters.
#
# A doc-only PR genuinely can't change lint/type/test results, so skipping it
# looks like free savings. It isn't: GitHub does NOT report a status for a
# workflow that was filtered out, so the moment this job is a *required*
# status check, a PR touching only `**.md` sits forever on "Expected —
# waiting for status to be reported" and can never merge. The documented
# workaround (a companion always-passes workflow declaring identical job
# names) has its own flaw: on a PR touching BOTH a doc and code, real and
# companion workflows both fire and both report the same check name, and
# whichever lands last wins — an always-pass job racing a genuine failure.
#
# This repo is public, so Actions minutes are unlimited and free. The
# "savings" were worth exactly nothing while the trap was real. Running CI
# on doc-only PRs costs a few unlimited minutes and removes the failure mode
# entirely — no companion workflow to keep in sync, no race. See
# docs/runbooks/ci-cd.md.
#
# `push` keeps paths-ignore: post-merge re-verification of a doc-only commit
# has no branch-protection semantics attached, so skipping is pure upside.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-type-test:
    name: lint + typecheck + unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Defense in depth alongside pytest's own --timeout=120 per-test cap:
    # this bounds the WHOLE job (a hung `pip install`, not just a hung
    # test), so a stuck run fails within minutes instead of running until
    # GitHub's default 6-hour ceiling.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      ENV: test
      AUTH_ENABLED: "false"
      # Settings.validate() rejects the "CHANGE_ME_IN_PRODUCTION" default for
      # SECRET_KEY/JWT_SECRET_KEY whenever ENV != "development" (independent
      # of AUTH_ENABLED above) — a pre-existing gap that only surfaced once
      # `ruff` stopped failing first and the job actually reached the pytest
      # step. Placeholder values only, never used to sign anything real.
      SECRET_KEY: "ci-test-only-placeholder-secret-not-a-real-credential"
      JWT_SECRET_KEY: "ci-test-only-placeholder-jwt-secret-not-a-real-credential"
    steps:
      - uses: actions/checkout@v4

      # NO `cache: pip` — deliberate, and it is not an oversight.
      #
      # requirements.txt pulls torch + the CUDA/ML stack, so the pip download
      # cache lands at ~4.8GB PER PYTHON VERSION. With a matrix of two, that is
      # ~9.7GB of GitHub's 10GB per-repo cache limit, which starved the thing
      # that actually matters: cd.yml's Docker buildx layer cache
      # (`type=gha,scope=magik-cuda-runtime`). Measured 2026-07-30 —
      # `gh cache list` showed the two pip entries at 4.84GiB each and NO
      # buildx entry at all, which is why every tagged build recompiled
      # llama-cpp-python from source for ~1h even after the cache scope was
      # pinned.
      #
      # The trade is lopsided in the obvious direction: this costs ~2-3 min of
      # pip downloads per run and buys back ~60 min per release build.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Runtime deps are needed for import-time collection (app/core/config.py
      # etc. are plain `os.getenv(..., default)` — no required secrets — but
      # the modules themselves still need fastapi/pydantic/etc. importable).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt's own header documents this: torch/torchvision/
          # torchaudio must be installed explicitly BEFORE the rest, with the
          # index matching the target hardware, because `pip install -r
          # requirements.txt` alone resolves torch>=2.6 from PyPI's default
          # index — which is a CUDA build pulling in triton + nvidia-cuda-*
          # bindings. This hosted runner has no GPU/driver, and those CUDA
          # bindings segfault (not a clean Python exception) the moment
          # `import torch` touches torch._dynamo/triton at collection time.
          # This step was simply missing here — invisible until now because
          # `ruff` always failed first and the job never reached `pytest`.
          #
          # torchcodec included here too — torchaudio's own transitive
          # dependency (modern torchaudio delegates torchaudio.load() to
          # it), not declared directly in requirements.txt. Without pinning
          # it to this same CPU index it resolved from PyPI's default index
          # instead, with .so files that hard-require libnvrtc.so.13 (CUDA
          # runtime) just to *import* — confirmed live (2026-07-31) crashing
          # a plain text-only BGE embedder load, because transformers/
          # sentence-transformers eagerly probe torchaudio (which eagerly
          # probes torchcodec) even when loading a model that never touches
          # audio.
          pip install torch torchvision torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e ".[dev]"

      # ui/ is a Vite/React/JS project (no .py files) — Python lint scope is
      # app/ only, matching pyproject.toml's own [tool.setuptools] package scope.
      - name: ruff
        run: ruff check app/

      - name: black --check
        run: black --check app/

      - name: isort --check
        run: isort --check app/

      # Non-blocking by deliberate decision, not oversight: a real run against
      # this codebase found 311 pre-existing errors across 65 files (type
      # debt from before this workflow existed, not introduced by it). A gate
      # that's red on day one trains people to ignore it — this stays
      # visible (the step still shows failed/red in the Actions UI) without
      # blocking merges until a dedicated type-debt paydown pass (architect/
      # code-review scope, not devops) gets the baseline clean. Flip
      # continue-on-error to false once that lands. See
      # docs/runbooks/phase29-plan.md workstream B.
      - name: mypy
        continue-on-error: true
        run: mypy app/

      # Scoped to tests/unit/ directly, not `pytest tests/ -m unit` — the
      # latter still COLLECTS (imports) every file under tests/ before
      # filtering by marker, including tests/auth, tests/eval,
      # tests/guardrails, tests/integration. CONFIRMED root cause (not just
      # suspected): 27 of tests/integration/'s 42 files fail to import —
      # stale APIs, some reference a pre-refactor `src.rag_system.*` package
      # that no longer exists — so a bare `tests/ -m unit` run hits
      # "Interrupted: N errors during collection" and runs ZERO tests,
      # presenting as an unpredictable hang rather than a fast clear
      # failure. Full writeup: docs/runbooks/ci-cd.md and
      # docs/runbooks/phase29-plan.md workstream D. Scoping the path here is
      # a real fix, not a workaround: nothing outside tests/unit/ can ever
      # match `-m unit` anyway.
      # pyproject.toml's [tool.coverage.report] fail_under=70 is measured
      # against the FULL app/ package, but this step only runs tests/unit/
      # (by design — see the comment above). tests/unit/ alone can never
      # reach 70% of app/'s total surface; that number only becomes
      # meaningful once the full suite (unit+integration+guardrails+auth+eval)
      # runs together, which isn't possible today given the collection
      # failures documented above. --cov-fail-under=0 overrides just this
      # invocation so a coverage percentage doesn't fail the build — actual
      # test failures/errors above still do, this only affects the coverage
      # threshold. fail_under=70 stays in pyproject.toml as the real target
      # for whenever a combined full-suite run exists; this is the same
      # "visible but non-blocking until paid down" precedent as mypy above,
      # applied surgically instead of via continue-on-error (which would
      # also silence genuine test failures, not just the coverage number).
      # `-m "unit and not slow"`, not a bare `-m unit`. tests/conftest.py's
      # pytest_collection_modifyitems auto-applies the `unit` marker to
      # EVERYTHING under tests/unit/ by directory, so a file that marks itself
      # `pytest.mark.slow` still comes back as `unit` too and a bare `-m unit`
      # selects it anyway. That silently broke this job's stated contract (see
      # the header: "No models, no GPU, no external services"):
      # tests/unit/verification/test_groundedness_checker_nli.py and
      # test_hallucination_detector_consolidation.py (14 tests) exercise the
      # REAL cross-encoder/nli-deberta-v3-base model and call
      # model_loader.get_nli_model() at COLLECTION time, from their own
      # module-level skipif — on a runner with no .hf_cache/ that is a ~400MB
      # HuggingFace download inside a 15-minute job, and if it succeeds the
      # tests then run and are order-dependent (they pass alone, fail after
      # other model-loading tests in the same process). Both files already
      # carry `pytest.mark.slow` and their own skipif; excluding `slow` here
      # is what those markers were for. They stay runnable locally and in the
      # Tier-2/nightly path — `make test-unit` uses this same selector.
      - name: pytest -m "unit and not slow"
        run: pytest tests/unit/ -m "unit and not slow" -q --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=0

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
